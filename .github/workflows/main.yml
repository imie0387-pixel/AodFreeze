name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver Win32
        run: msbuild DiskFilter\DiskFilter.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build driver x64
        run: msbuild DiskFilter\DiskFilter.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path DistDriver\i386
          New-Item -ItemType Directory -Force -Path DistDriver\amd64
          Copy-Item DiskFilter\Release\diskflt.sys DistDriver\i386\diskflt.sys -Force
          Copy-Item DiskFilter\x64\Release\diskflt.sys DistDriver\amd64\diskflt.sys -Force

      - name: Build management tools
        run: msbuild DiskFilter.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.sys,*.exe |
            Select-Object FullName,Length
