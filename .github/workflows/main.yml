name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Install Windows 11 SDK 26100
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.Windows11SDK.26100

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check Windows SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "WINDOWS SDK / WDK CHECK"
          Write-Host "=============================================="

          $kitsRoot = "$env:ProgramFiles(x86)\Windows Kits\10"

          if (-not (Test-Path $kitsRoot)) {
            throw "Windows Kits directory not found: $kitsRoot"
          }

          Write-Host ""
          Write-Host "Windows Kits root:"
          Write-Host $kitsRoot

          Write-Host ""
          Write-Host "Installed SDK/WDK directories:"

          Get-ChildItem "$kitsRoot\bin" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name |
            Select-Object FullName

      - name: Build driver x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD DRIVER X64"
          Write-Host "=============================================="

          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed."
          }

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "DistDriver" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\i386" |
            Out-Null

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.inf" `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.cat" `
            "DistDriver\diskflt.cat" `
            -Force

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "DISTDRIVER"
          Write-Host "=============================================="

          Get-ChildItem `
            "DistDriver" `
            -Recurse |
            Select-Object FullName, Length

      - name: Build management tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILD MANAGEMENT TOOLS"
          Write-Host "=============================================="

          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Management tools build failed."
          }

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "LOCATE SIGNTOOL / INF2CAT"
          Write-Host "=============================================="

          $searchRoots = @(
            "$env:ProgramFiles(x86)\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin",
            "$env:ProgramFiles(x86)\Windows Kits\10\App Certification Kit",
            "$env:ProgramFiles\Windows Kits\10\App Certification Kit"
          )

          Write-Host ""
          Write-Host "Search roots:"

          foreach ($root in $searchRoots) {
            Write-Host "  $root"
          }

          $signtoolCandidates = @()

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "signtool.exe" `
                -ErrorAction SilentlyContinue

              if ($found) {
                $signtoolCandidates += $found
              }
            }
          }

          $signtoolCandidates = @(
            $signtoolCandidates |
              Sort-Object FullName -Unique
          )

          Write-Host ""
          Write-Host "Found signtool candidates:"

          foreach ($item in $signtoolCandidates) {
            Write-Host "  $($item.FullName)"
          }

          if ($signtoolCandidates.Count -eq 0) {
            Write-Host ""
            Write-Host "Attempting PATH lookup..."

            $pathSigntool = Get-Command `
              signtool.exe `
              -ErrorAction SilentlyContinue

            if ($pathSigntool) {
              $signtoolCandidates = @(
                Get-Item $pathSigntool.Source
              )
            }
          }

          if ($signtoolCandidates.Count -eq 0) {
            throw "signtool.exe not found after Windows SDK installation."
          }

          $signtool = $signtoolCandidates |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            $signtool = $signtoolCandidates |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          $inf2catCandidates = @()

          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $found = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "inf2cat.exe" `
                -ErrorAction SilentlyContinue

              if ($found) {
                $inf2catCandidates += $found
              }
            }
          }

          $inf2catCandidates = @(
            $inf2catCandidates |
              Sort-Object FullName -Unique
          )

          Write-Host ""
          Write-Host "Found inf2cat candidates:"

          foreach ($item in $inf2catCandidates) {
            Write-Host "  $($item.FullName)"
          }

          if ($inf2catCandidates.Count -eq 0) {
            throw "inf2cat.exe not found."
          }

          $inf2cat = $inf2catCandidates |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          Write-Host ""
          Write-Host "Selected SignTool:"
          Write-Host $signtool.FullName

          Write-Host ""
          Write-Host "Selected Inf2Cat:"
          Write-Host $inf2cat.FullName

          "SIGNTOOL=$($signtool.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "INF2CAT=$($inf2cat.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CREATE TEST CERTIFICATE"
          Write-Host "=============================================="

          $certDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Signing"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $certDir |
            Out-Null

          $pfxPath = Join-Path `
            $certDir `
            "AodFreeze-Test.pfx"

          $cerPath = Join-Path `
            $certDir `
            "AodFreeze-Test.cer"

          $pfxPasswordText = "AodFreeze-Test-2026!"

          $pfxPassword = ConvertTo-SecureString `
            $pfxPasswordText `
            -AsPlainText `
            -Force

          Get-ChildItem `
            "Cert:\CurrentUser\My" |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            } |
            Remove-Item `
              -Force `
              -ErrorAction SilentlyContinue

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AodFreeze Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(13)

          if (-not $cert) {
            throw "Could not create test certificate."
          }

          Write-Host ""
          Write-Host "Certificate:"
          Write-Host "Subject    : $($cert.Subject)"
          Write-Host "Thumbprint : $($cert.Thumbprint)"
          Write-Host "Expires    : $($cert.NotAfter)"

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath `
            -Force |
            Out-Null

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfxPath `
            -Password $pfxPassword `
            -Force |
            Out-Null

          if (-not (Test-Path $pfxPath)) {
            throw "PFX was not created."
          }

          if (-not (Test-Path $cerPath)) {
            throw "CER was not created."
          }

          "PFX_PATH=$pfxPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "CER_PATH=$cerPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "PFX_PASSWORD=$pfxPasswordText" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "SIGN $sys"
            Write-Host "=============================================="

            & "$env:SIGNTOOL" sign `
              /v `
              /fd SHA256 `
              /f "$env:PFX_PATH" `
              /p "$env:PFX_PASSWORD" `
              "$sys"

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $sys"
            }

            Write-Host "SIGN OK: $sys"
          }

      - name: Trust test certificate on build runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "TRUST TEST CERTIFICATE"
          Write-Host "=============================================="

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

          Write-Host "Certificate imported into trusted stores."

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "VERIFY $sys"
            Write-Host "=============================================="

            & "$env:SIGNTOOL" verify `
              /v `
              /pa `
              "$sys"

            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $sys"
            }

            Write-Host "VERIFY OK: $sys"
          }

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $driverDir = (Resolve-Path "DistDriver").Path

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "INF2CAT WINDOWS 11 25H2 X64"
          Write-Host "=============================================="

          Write-Host "Driver directory:"
          Write-Host $driverDir

          Write-Host ""
          Write-Host "OS identifier:"
          Write-Host "10_25H2_X64"

          & "$env:INF2CAT" `
            /driver:$driverDir `
            /os:10_25H2_X64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed."
          }

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($catFiles.Count -eq 0) {
            throw "Inf2Cat completed but no CAT file was generated."
          }

          Write-Host ""
          Write-Host "Generated catalog:"

          $catFiles |
            Select-Object FullName, Length

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File
          )

          if ($catFiles.Count -eq 0) {
            throw "No catalog file found."
          }

          foreach ($cat in $catFiles) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "SIGN CATALOG"
            Write-Host $cat.FullName
            Write-Host "=============================================="

            & "$env:SIGNTOOL" sign `
              /v `
              /fd SHA256 `
              /f "$env:PFX_PATH" `
              /p "$env:PFX_PASSWORD" `
              "$($cat.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "Catalog signing failed."
            }

            Write-Host "CATALOG SIGN OK."
          }

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File
          )

          foreach ($cat in $catFiles) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "VERIFY CATALOG"
            Write-Host $cat.FullName
            Write-Host "=============================================="

            & "$env:SIGNTOOL" verify `
              /v `
              /pa `
              "$($cat.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "Catalog verification failed."
            }

            Write-Host "CATALOG VERIFY OK."
          }

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools" |
            Out-Null

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          Copy-Item `
            "$env:CER_PATH" `
            "$package\AodFreeze-Test.cer" `
            -Force

          $readme = @(
            "AodFreeze"
            "========="
            ""
            "TEST BUILD"
            ""
            "Driver:"
            "  Driver\diskflt.inf"
            "  Driver\diskflt.cat"
            "  Driver\amd64\diskflt.sys"
            "  Driver\i386\diskflt.sys"
            ""
            "Tools:"
            "  Tools\DiskfltInst.exe"
            "  Tools\DiskfltBufmon.exe"
            "  Tools\diskfltmgmt.exe"
            "  Tools\cabarc.exe"
            ""
            "Test certificate:"
            "  AodFreeze-Test.cer"
            ""
            "Target:"
            "  Windows 11 25H2 x64"
            ""
            "Inf2Cat:"
            "  /os:10_25H2_X64"
            ""
            "Signing:"
            "  SHA256"
            "  Self-signed TEST certificate"
            ""
            "IMPORTANT:"
            "This package contains a TEST-SIGNED kernel driver."
            ""
            "For testing:"
            "1. Enable Windows test signing."
            "2. Install AodFreeze-Test.cer into:"
            "   Local Machine\Trusted Root Certification Authorities"
            "3. Install AodFreeze-Test.cer into:"
            "   Local Machine\Trusted Publishers"
            "4. Install the driver package."
            ""
            "This is NOT a production/Microsoft-signed driver package."
            ""
            "This package was built by GitHub Actions."
          )

          $readme |
            Set-Content `
              "$package\README.txt" `
              -Encoding UTF8

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "FINAL PACKAGE"
          Write-Host "=============================================="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "ZIP:"

          Get-Item `
            "AodFreeze-package.zip" |
            Select-Object FullName, Length

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "FINAL SIGNATURES AND SHA256"
          Write-Host "=============================================="

          $files = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys",
            "DistDriver\diskflt.cat"
          )

          foreach ($file in $files) {

            Write-Host ""
            Write-Host "=============================================="
            Write-Host $file
            Write-Host "=============================================="

            Get-FileHash `
              $file `
              -Algorithm SHA256

            Get-AuthenticodeSignature `
              $file |
              Format-List `
                Status,
                StatusMessage,
                Path,
                SignerCertificate
          }

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test-package
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
