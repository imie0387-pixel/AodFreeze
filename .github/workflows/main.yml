name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 1. BUILD DRIVER
      # ============================================================

      - name: Build driver x64
        run: |
          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 2. PREPARE DistDriver
      # ============================================================

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item "DistDriver" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "DistDriver"
          New-Item -ItemType Directory -Force -Path "DistDriver\amd64"
          New-Item -ItemType Directory -Force -Path "DistDriver\i386"

          $driver = "DiskFilter\x64\Release\diskflt.sys"
          $inf = "DiskFilter\x64\Release\DiskFilter\diskflt.inf"
          $cat = "DiskFilter\x64\Release\DiskFilter\diskflt.cat"

          if (!(Test-Path $driver)) {
            throw "BRAK: $driver"
          }

          if (!(Test-Path $inf)) {
            throw "BRAK: $inf"
          }

          if (!(Test-Path $cat)) {
            throw "BRAK: $cat"
          }

          Copy-Item `
            $driver `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            $driver `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            $inf `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            $cat `
            "DistDriver\diskflt.cat" `
            -Force

          Write-Host "=== DistDriver ==="

          Get-ChildItem "DistDriver" -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # 3. BUILD MANAGEMENT TOOLS
      # ============================================================

      - name: Build management tools
        run: |
          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 4. LOCATE SIGNTOOL
      # ============================================================

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse `
            -Filter "signtool.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$signtool) {
            throw "Nie znaleziono signtool.exe"
          }

          Write-Host "signtool = $($signtool.FullName)"

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 5. CREATE TEST SIGNING CERTIFICATE
      # ============================================================

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating AodFreeze test certificate ==="

          Remove-Item `
            "AodFreezeTest.cer" `
            -Force `
            -ErrorAction SilentlyContinue

          $existing = Get-ChildItem `
            Cert:\CurrentUser\My |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            }

          foreach ($cert in $existing) {
            Remove-Item $cert.PSPath -Force
          }

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AodFreeze Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyLength 2048 `
            -NotAfter (Get-Date "2039-12-31")

          if (!$cert) {
            throw "Nie udało się utworzyć certyfikatu."
          }

          $thumbprint = $cert.Thumbprint

          Write-Host "Certificate:"
          Write-Host "Subject: $($cert.Subject)"
          Write-Host "Thumbprint: $thumbprint"
          Write-Host "Expires: $($cert.NotAfter)"

          Export-Certificate `
            -Cert $cert `
            -FilePath "AodFreezeTest.cer" `
            -Force

          "SIGN_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Certificate exported to AodFreezeTest.cer"

      # ============================================================
      # 6. SIGN DRIVER
      # ============================================================

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $sysFiles) {

            if (!(Test-Path $file)) {
              throw "BRAK pliku: $file"
            }

            Write-Host ""
            Write-Host "=== SIGNING $file ==="

            & $env:SIGNTOOL `
              sign `
              /v `
              /fd SHA256 `
              /sha1 $env:SIGN_CERT_THUMBPRINT `
              "$file"

            if ($LASTEXITCODE -ne 0) {
              throw "Podpisywanie nie powiodło się: $file"
            }
          }

      # ============================================================
      # 7. VERIFY EMBEDDED SIGNATURES
      # ============================================================

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $sysFiles) {

            Write-Host ""
            Write-Host "=== VERIFY $file ==="

            & $env:SIGNTOOL verify /pa /v "$file"

            if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "INFO: Certyfikat testowy nie jest zaufany przez domyślny Windows trust store."
              Write-Host "INFO: Podpis znajduje się w pliku i jest poprawny."
              Write-Host "INFO: Na komputerze testowym certyfikat zostanie dodany do zaufanych."
            }
          }

      # ============================================================
      # 8. GENERATE CATALOG
      # ============================================================

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "DistDriver\diskflt.cat" `
            -Force `
            -ErrorAction SilentlyContinue

          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\inf2cat.exe" `
            /driver:"DistDriver" `
            /os:10_X64

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat zakończył się błędem: $LASTEXITCODE"
          }

          if (!(Test-Path "DistDriver\diskflt.cat")) {
            throw "Brak DistDriver\diskflt.cat"
          }

          Write-Host "Catalog generated."

      # ============================================================
      # 9. SIGN CATALOG
      # ============================================================

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SIGNING CATALOG ==="

          & $env:SIGNTOOL `
            sign `
            /v `
            /fd SHA256 `
            /sha1 $env:SIGN_CERT_THUMBPRINT `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Podpisywanie katalogu nie powiodło się."
          }

      # ============================================================
      # 10. VERIFY CATALOG
      # ============================================================

      - name: Verify catalog signature
        shell: pwsh
        run: |
          Write-Host "=== VERIFY CATALOG ==="

          & $env:SIGNTOOL `
            verify `
            /pa `
            /v `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "INFO: Certyfikat testowy nie jest zaufany na runnerze."
            Write-Host "INFO: Podpis katalogu został wykonany."
          }

      # ============================================================
      # 11. PREPARE FINAL PACKAGE
      # ============================================================

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "AodFreeze-package.zip" `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "$package\Driver\amd64"
          New-Item -ItemType Directory -Force -Path "$package\Driver\i386"
          New-Item -ItemType Directory -Force -Path "$package\Tools"

          # Driver files
          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          # Test certificate
          Copy-Item `
            "AodFreezeTest.cer" `
            "$package\Driver\AodFreezeTest.cer" `
            -Force

          # Tools
          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          if (Test-Path "cabarc.exe") {
            Copy-Item `
              "cabarc.exe" `
              "$package\Tools\cabarc.exe" `
              -Force
          }

          @"
          AodFreeze
          ==========

          Driver:
            Driver\diskflt.inf
            Driver\diskflt.cat
            Driver\amd64\diskflt.sys
            Driver\i386\diskflt.sys
            Driver\AodFreezeTest.cer

          Tools:
            Tools\DiskfltInst.exe
            Tools\DiskfltBufmon.exe
            Tools\diskfltmgmt.exe
            Tools\cabarc.exe (if present)

          Build:
            Release
            x64
            Windows 11
            WDK 10.0.26100.0

          Signing:
            TEST SIGNED
            AodFreeze Test Certificate

          IMPORTANT:
            This package is for Windows test-signing mode.

            Before installing the driver on the test computer,
            import Driver\AodFreezeTest.cer into:

              Trusted Root Certification Authorities
              Trusted Publishers

            Test signing must also be enabled:

              bcdedit /set testsigning on

            This is NOT Microsoft production signing.
          "@ | Set-Content `
            "$package\README.txt" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=== PACKAGE CONTENTS ==="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

      # ============================================================
      # 12. SHOW HASHES
      # ============================================================

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          Write-Host "=== DRIVER HASHES ==="

          Get-ChildItem `
            "AodFreeze-package\Driver" `
            -Recurse `
            -Include *.sys,*.cat,*.cer |
            ForEach-Object {

              Write-Host ""
              Write-Host "FILE: $($_.FullName)"

              Get-FileHash `
                $_.FullName `
                -Algorithm SHA256
            }

          Write-Host ""
          Write-Host "=== ZIP HASH ==="

          Get-FileHash `
            "AodFreeze-package.zip" `
            -Algorithm SHA256

      # ============================================================
      # 13. UPLOAD
      # ============================================================

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
