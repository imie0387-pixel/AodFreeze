name: Build AodFreeze - Microsoft Attestation

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: aodfreeze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 / WinXP / v141 MFC support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          if (-not (Test-Path $setup)) {
            throw "Visual Studio setup.exe not found: $setup"
          }

          $vsPath = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath |
            Select-Object -First 1).Trim()

          if (-not $vsPath) {
            throw "Visual Studio installation path could not be detected."
          }

          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"

          $findV141 = {
            $dirs = @(
              Get-ChildItem $msvcRoot -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like "14.16*" } |
                Sort-Object Name -Descending
            )

            foreach ($dir in $dirs) {
              $cl1 = Join-Path $dir.FullName "bin\HostX86\x64\cl.exe"
              $cl2 = Join-Path $dir.FullName "bin\Hostx64\x64\cl.exe"
              $afx = Join-Path $dir.FullName "atlmfc\include\afxwin.h"

              if (((Test-Path $cl1) -or (Test-Path $cl2)) -and (Test-Path $afx)) {
                return $dir.FullName
              }
            }

            return $null
          }

          $v141Path = & $findV141

          if (-not $v141Path) {
            $components = @(
              "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
              "Microsoft.VisualStudio.Component.VC.v141.MFC",
              "Microsoft.VisualStudio.Component.WinXP"
            )

            foreach ($component in $components) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $setup
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true

              [void]$psi.ArgumentList.Add("modify")
              [void]$psi.ArgumentList.Add("--installPath")
              [void]$psi.ArgumentList.Add($vsPath)
              [void]$psi.ArgumentList.Add("--channelId")
              [void]$psi.ArgumentList.Add("VisualStudio.17.Release")
              [void]$psi.ArgumentList.Add("--add")
              [void]$psi.ArgumentList.Add($component)
              [void]$psi.ArgumentList.Add("--quiet")
              [void]$psi.ArgumentList.Add("--norestart")

              $process = [System.Diagnostics.Process]::Start($psi)

              if (-not $process) {
                throw "Failed to start installer for $component"
              }

              $process.WaitForExit()

              if ($process.ExitCode -notin @(0, 3010, 1641)) {
                throw "Installation failed for ${component}: exit code $($process.ExitCode)"
              }
            }

            Start-Sleep -Seconds 3
            $v141Path = & $findV141
          }

          if (-not $v141Path) {
            throw "v141 compiler/MFC installation could not be verified."
          }

          Write-Host "v141 path: $v141Path"
          Write-Host "Compiler: $(Join-Path $v141Path 'bin\HostX86\x64\cl.exe')"
          Write-Host "MFC: $(Join-Path $v141Path 'atlmfc\include\afxwin.h')"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $PWD "DiskFilter\DiskFilter.vcxproj"

          if (-not (Test-Path $project)) {
            throw "Driver project not found: $project"
          }

          & msbuild $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare DistDriver for solution build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $PWD "DistDriver"

          New-Item -ItemType Directory -Force -Path `
            $dist, `
            "$dist\amd64", `
            "$dist\i386" |
            Out-Null

          $sys = Join-Path $PWD "DiskFilter\x64\Release\diskflt.sys"
          $inf = Join-Path $PWD "DiskFilter\x64\Release\DiskFilter\diskflt.inf"
          $cat = Join-Path $PWD "DiskFilter\x64\Release\DiskFilter\diskflt.cat"

          foreach ($file in @($sys, $inf, $cat)) {
            if (-not (Test-Path $file)) {
              throw "Required build file not found: $file"
            }
          }

          Copy-Item $sys $dist -Force
          Copy-Item $inf $dist -Force
          Copy-Item $cat $dist -Force
          Copy-Item $sys "$dist\amd64\diskflt.sys" -Force
          Copy-Item $sys "$dist\i386\diskflt.sys" -Force

      - name: Build full solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $solution = Join-Path $PWD "DiskFilter.sln"

          if (-not (Test-Path $solution)) {
            throw "Solution not found: $solution"
          }

          & msbuild $solution `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Solution build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare AttestationSource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD "AttestationSource"

          if (Test-Path $source) {
            Remove-Item $source -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $source | Out-Null

          $sys = Join-Path $PWD "DiskFilter\x64\Release\diskflt.sys"
          $pdb = Join-Path $PWD "DiskFilter\x64\Release\diskflt.pdb"
          $inf = Join-Path $PWD "DiskFilter\x64\Release\DiskFilter\diskflt.inf"

          foreach ($file in @($sys, $pdb, $inf)) {
            if (-not (Test-Path $file)) {
              throw "Attestation input not found: $file"
            }
          }

          Copy-Item $sys $source -Force
          Copy-Item $pdb $source -Force
          Copy-Item $inf $source -Force

          Get-ChildItem $source -File |
            Select-Object Name, Length

      - name: Locate Inf2Cat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $preferred = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x86\Inf2Cat.exe"

          if (Test-Path $preferred) {
            $inf2cat = $preferred
          }
          else {
            $inf2cat = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter Inf2Cat.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $inf2cat) {
            throw "Inf2Cat.exe not found."
          }

          "INF2CAT_PATH=$inf2cat" >> $env:GITHUB_ENV

          Write-Host "Inf2Cat: $inf2cat"

      - name: Generate attestation catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD "AttestationSource"

          & $env:INF2CAT_PATH `
            /driver:"$source" `
            /os:10_x64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE"
          }

          $cat = Join-Path $source "diskflt.cat"

          if (-not (Test-Path $cat)) {
            throw "Catalog was not generated: $cat"
          }

          Get-Item $cat |
            Select-Object FullName, Length

      - name: Locate MakeCab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $makecab = Get-Command makecab.exe -ErrorAction SilentlyContinue

          if (-not $makecab) {
            $makecab = Get-ChildItem `
              "${env:SystemRoot}\System32" `
              -Filter makecab.exe `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $makecab) {
            throw "makecab.exe not found."
          }

          "MAKECAB_PATH=$($makecab.Source)" >> $env:GITHUB_ENV

          Write-Host "MakeCab: $($makecab.Source)"

      - name: Create attestation CAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD "AttestationSource"
          $ddf = Join-Path $PWD "AttestationSubmission.ddf"
          $cabRoot = Join-Path $PWD "CabOutput"

          if (Test-Path $cabRoot) {
            Remove-Item $cabRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $cabRoot | Out-Null

          @"
          .OPTION EXPLICIT
          .Set CabinetFileCountThreshold=0
          .Set FolderFileCountThreshold=0
          .Set FolderSizeThreshold=0
          .Set MaxCabinetSize=0
          .Set MaxDiskFileCount=0
          .Set MaxDiskSize=0
          .Set CompressionType=MSZIP
          .Set Cabinet=on
          .Set Compress=on
          .Set CabinetNameTemplate=AodFreeze-attestation.cab
          .Set DiskDirectoryTemplate=CabOutput
          .Set DestinationDir=AodFreeze
          $source\diskflt.inf
          $source\diskflt.sys
          $source\diskflt.pdb
          $source\diskflt.cat
          "@ | Set-Content $ddf -Encoding ASCII

          Push-Location $PWD

          & $env:MAKECAB_PATH /F $ddf

          $exitCode = $LASTEXITCODE

          Pop-Location

          if ($exitCode -ne 0) {
            throw "MakeCab failed with exit code $exitCode"
          }

          $cab = Get-ChildItem `
            $cabRoot `
            -Filter "AodFreeze-attestation.cab" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $cab) {
            throw "CAB was not created."
          }

          $finalCab = Join-Path $PWD "AodFreeze-attestation.cab"

          Copy-Item $cab.FullName $finalCab -Force

          Write-Host "CAB:"
          Get-Item $finalCab |
            Select-Object FullName, Length

      - name: Verify CAB structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cab = Join-Path $PWD "AodFreeze-attestation.cab"

          if (-not (Test-Path $cab)) {
            throw "CAB not found: $cab"
          }

          $expand = Get-Command expand.exe -ErrorAction SilentlyContinue

          if (-not $expand) {
            throw "expand.exe not found."
          }

          $verify = Join-Path $env:RUNNER_TEMP "cab-verify"

          if (Test-Path $verify) {
            Remove-Item $verify -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $verify | Out-Null

          & $expand.Source "-F:*" $cab $verify

          if ($LASTEXITCODE -ne 0) {
            throw "CAB extraction failed with exit code $LASTEXITCODE"
          }

          $files = Get-ChildItem $verify -Recurse -File

          if (-not $files) {
            throw "CAB contains no files."
          }

          Write-Host "=== CAB CONTENTS ==="

          $files |
            ForEach-Object {
              $_.FullName.Substring($verify.Length).TrimStart('\')
            }

          $rootFiles = Get-ChildItem $verify -File

          if ($rootFiles.Count -ne 0) {
            throw "CAB contains files at root level."
          }

          $driverDir = Join-Path $verify "AodFreeze"

          if (-not (Test-Path $driverDir)) {
            throw "CAB driver directory missing: AodFreeze"
          }

          foreach ($name in @(
            "diskflt.inf",
            "diskflt.sys",
            "diskflt.pdb",
            "diskflt.cat"
          )) {
            $path = Join-Path $driverDir $name

            if (-not (Test-Path $path)) {
              throw "CAB missing: AodFreeze\$name"
            }
          }

          Write-Host "CAB structure OK."

      - name: Optional EV-sign attestation CAB
        shell: pwsh
        env:
          EV_PFX_BASE64: ${{ secrets.EV_PFX_BASE64 }}
          EV_PFX_PASSWORD: ${{ secrets.EV_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:EV_PFX_BASE64)) {
            Write-Host "EV certificate not configured. CAB remains unsigned."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:EV_PFX_PASSWORD)) {
            throw "EV_PFX_PASSWORD is required."
          }

          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"

          if (-not (Test-Path $signtool)) {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\x64\\signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "AodFreeze-EV.pfx"

          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:EV_PFX_BASE64)
          )

          $securePassword = ConvertTo-SecureString `
            $env:EV_PFX_PASSWORD `
            -AsPlainText `
            -Force

          $cert = Import-PfxCertificate `
            -FilePath $pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword

          if (-not $cert) {
            throw "EV certificate import failed."
          }

          $cab = Join-Path $PWD "AodFreeze-attestation.cab"

          & $signtool sign `
            /v `
            /fd sha256 `
            /tr https://timestamp.digicert.com `
            /td sha256 `
            /sha1 $cert.Thumbprint `
            $cab

          if ($LASTEXITCODE -ne 0) {
            throw "EV CAB signing failed with exit code $LASTEXITCODE"
          }

          & $signtool verify `
            /v `
            /pa `
            $cab

          if ($LASTEXITCODE -ne 0) {
            throw "EV CAB verification failed."
          }

          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: Create submission README
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @"
          AodFreeze Microsoft Attestation Submission

          CAB:
            AodFreeze-attestation.cab

          Driver package:
            AodFreeze\
              diskflt.inf
              diskflt.sys
              diskflt.pdb
              diskflt.cat

          The CAB must be EV-signed before submission to Microsoft Hardware Dev Center.
          Microsoft regenerates the catalog during signing.
          "@ |
            Set-Content "Attestation-README.txt" -Encoding UTF8

      - name: Final checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $PWD "AttestationSource"
          $cab = Join-Path $PWD "AodFreeze-attestation.cab"

          foreach ($file in @(
            "$source\diskflt.sys",
            "$source\diskflt.inf",
            "$source\diskflt.pdb",
            "$source\diskflt.cat",
            $cab,
            "$PWD\Attestation-README.txt"
          )) {
            if (-not (Test-Path $file)) {
              throw "Required file missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host "=== ATTESTATION SOURCE ==="

          Get-ChildItem $source -File |
            Select-Object Name, Length

          Write-Host "=== CAB SHA256 ==="

          Get-FileHash $cab -Algorithm SHA256

      - name: Upload attestation package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-attestation
          path: |
            AodFreeze-attestation.cab
            AttestationSource
            Attestation-README.txt
          if-no-files-found: error
          retention-days: 14
