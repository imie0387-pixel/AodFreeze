name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 1. BUILD DRIVER
      # ============================================================

      - name: Build driver x64
        run: |
          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 2. PREPARE DistDriver
      #    This directory is required by the resource compiler
      #    in DiskfltInst and diskfltmgmt.
      # ============================================================

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          Remove-Item DistDriver -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path DistDriver
          New-Item -ItemType Directory -Force -Path DistDriver\amd64
          New-Item -ItemType Directory -Force -Path DistDriver\i386

          Copy-Item `
            DiskFilter\x64\Release\DiskFilter\diskflt.inf `
            DistDriver\diskflt.inf `
            -Force

          Copy-Item `
            DiskFilter\x64\Release\diskflt.sys `
            DistDriver\amd64\diskflt.sys `
            -Force

          Copy-Item `
            DiskFilter\x64\Release\diskflt.sys `
            DistDriver\i386\diskflt.sys `
            -Force

          Write-Host "=== INITIAL DistDriver ==="
          Get-ChildItem DistDriver -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # 3. LOCATE SIGNING TOOLS
      # ============================================================

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter signtool.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\x64\\signtool\.exe$'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          $inf2cat = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter inf2cat.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\x86\\inf2cat\.exe$'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          if (-not $inf2cat) {
            throw "inf2cat.exe not found"
          }

          Write-Host "SignTool:"
          Write-Host $signtool.FullName

          Write-Host "Inf2Cat:"
          Write-Host $inf2cat.FullName

          "SIGNTOOL=$($signtool.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "INF2CAT=$($inf2cat.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================================
      # 4. CREATE TEST CERTIFICATE
      # ============================================================

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $subject = "CN=AodFreeze Test Certificate"

          Get-ChildItem Cert:\LocalMachine\My |
            Where-Object {
              $_.Subject -eq $subject
            } |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date "2039-12-31 23:59:59") `
            -CertStoreLocation "Cert:\LocalMachine\My"

          if (-not $cert) {
            throw "Could not create test certificate"
          }

          Write-Host "Certificate:"
          Write-Host "Subject : $($cert.Subject)"
          Write-Host "Issuer  : $($cert.Issuer)"
          Write-Host "Thumb   : $($cert.Thumbprint)"
          Write-Host "Expires : $($cert.NotAfter)"

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:GITHUB_WORKSPACE\AodFreezeTest.cer" `
            -Force | Out-Null

          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================================
      # 5. TRUST TEST CERTIFICATE ON GITHUB RUNNER
      #    MUST happen BEFORE SIGNATURE VERIFICATION.
      # ============================================================

      - name: Trust test certificate on build runner
        shell: pwsh
        run: |
          $certFile = "$env:GITHUB_WORKSPACE\AodFreezeTest.cer"

          if (-not (Test-Path $certFile)) {
            throw "Certificate file not found: $certFile"
          }

          Import-Certificate `
            -FilePath $certFile `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath $certFile `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

          Write-Host "=== ROOT ==="

          Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            } |
            Format-List Subject,Issuer,Thumbprint,NotAfter

          Write-Host "=== TRUSTED PUBLISHER ==="

          Get-ChildItem Cert:\LocalMachine\TrustedPublisher |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            } |
            Format-List Subject,Issuer,Thumbprint,NotAfter

      # ============================================================
      # 6. SIGN DRIVER SYS FILES
      # ============================================================

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {
            if (-not (Test-Path $sys)) {
              throw "SYS file not found: $sys"
            }

            Write-Host ""
            Write-Host "=== SIGN $sys ==="

            & $env:SIGNTOOL sign `
              /v `
              /fd SHA256 `
              /sha1 $env:CERT_THUMBPRINT `
              $sys

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $sys"
            }
          }

      # ============================================================
      # 7. VERIFY EMBEDDED SYS SIGNATURES
      #    /pa is intentional here because the certificate has
      #    already been imported into the local trust stores.
      # ============================================================

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {
            Write-Host ""
            Write-Host "=== VERIFY $sys ==="

            & $env:SIGNTOOL verify `
              /pa `
              /v `
              $sys

            if ($LASTEXITCODE -ne 0) {
              throw "Embedded signature verification failed for $sys"
            }
          }

          Write-Host ""
          Write-Host "All embedded SYS signatures verified successfully."

      # ============================================================
      # 8. GENERATE CATALOG AFTER SYS SIGNING
      #    Windows 11 25H2 x64 = 10_25H2_X64
      # ============================================================

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          Remove-Item `
            DistDriver\diskflt.cat `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "=== INF2CAT WINDOWS 11 25H2 X64 ==="

          & $env:INF2CAT `
            /driver:"$env:GITHUB_WORKSPACE\DistDriver" `
            /os:10_25H2_X64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed"
          }

          if (-not (Test-Path "DistDriver\diskflt.cat")) {
            throw "diskflt.cat was not generated"
          }

          Write-Host ""
          Write-Host "Generated catalog:"
          Get-Item "DistDriver\diskflt.cat" |
            Select-Object FullName, Length

      # ============================================================
      # 9. SIGN CATALOG
      # ============================================================

      - name: Sign catalog
        shell: pwsh
        run: |
          $cat = "DistDriver\diskflt.cat"

          Write-Host "=== SIGN CATALOG ==="

          & $env:SIGNTOOL sign `
            /v `
            /fd SHA256 `
            /sha1 $env:CERT_THUMBPRINT `
            $cat

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog signing failed"
          }

      # ============================================================
      # 10. VERIFY CATALOG
      # ============================================================

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $cat = "DistDriver\diskflt.cat"

          Write-Host "=== VERIFY CATALOG ==="

          & $env:SIGNTOOL verify `
            /pa `
            /v `
            $cat

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog signature verification failed"
          }

          Write-Host ""
          Write-Host "=== VERIFY DRIVER AGAINST CATALOG ==="

          & $env:SIGNTOOL verify `
            /pa `
            /v `
            /c $cat `
            "DistDriver\amd64\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog does not validate amd64 driver"
          }

          & $env:SIGNTOOL verify `
            /pa `
            /v `
            /c $cat `
            "DistDriver\i386\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog does not validate i386 driver"
          }

          Write-Host ""
          Write-Host "Catalog and driver verification successful."

      # ============================================================
      # 11. BUILD MANAGEMENT TOOLS
      #
      # IMPORTANT:
      # DistDriver now contains the SIGNED driver.
      #
      # DiskfltInst and diskfltmgmt embed diskflt.sys as resources,
      # therefore they must be built AFTER the driver has been signed.
      # ============================================================

      - name: Build management tools
        run: |
          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 12. PREPARE FINAL AodFreeze PACKAGE
      # ============================================================

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "AodFreeze-package.zip" `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools"

          # Driver package

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          # Management tools

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          # Test certificate for the physical test PC

          Copy-Item `
            "AodFreezeTest.cer" `
            "$package\AodFreezeTest.cer" `
            -Force

          @"
          AodFreeze
          ==========

          TEST BUILD

          Driver:
            Driver\diskflt.inf
            Driver\diskflt.cat
            Driver\amd64\diskflt.sys
            Driver\i386\diskflt.sys

          Test certificate:
            AodFreezeTest.cer

          Tools:
            Tools\DiskfltInst.exe
            Tools\DiskfltBufmon.exe
            Tools\diskfltmgmt.exe
            Tools\cabarc.exe

          Target:
            Windows 11 25H2 x64

          Driver signing:
            AodFreeze Test Certificate

          IMPORTANT:
            This is a TEST-SIGNED driver package.
            It is intended for a Windows test system with TESTSIGNING enabled.

          Before installation on the test computer:
            1. Install AodFreezeTest.cer into:
               Local Computer -> Trusted Root Certification Authorities

            2. Install AodFreezeTest.cer into:
               Local Computer -> Trusted Publishers

            3. Confirm:
               bcdedit /enum {current}

               testsigning Yes

            4. Reboot Windows.

          "@ | Set-Content `
            "$package\README.txt" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=== FINAL PACKAGE ==="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

      # ============================================================
      # 13. FINAL SIGNATURE / HASH REPORT
      # ============================================================

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          $files = @(
            "AodFreeze-package\Driver\amd64\diskflt.sys",
            "AodFreeze-package\Driver\i386\diskflt.sys",
            "AodFreeze-package\Driver\diskflt.cat"
          )

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "============================================================"
            Write-Host $file
            Write-Host "============================================================"

            Get-FileHash `
              $file `
              -Algorithm SHA256

            & $env:SIGNTOOL verify `
              /pa `
              /v `
              $file

            if ($LASTEXITCODE -ne 0) {
              throw "Final signature verification failed: $file"
            }
          }

          Write-Host ""
          Write-Host "=== ZIP ==="

          Get-Item `
            "AodFreeze-package.zip" |
            Select-Object FullName, Length

      # ============================================================
      # 14. SHOW BUILD OUTPUT
      # ============================================================

      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "=== SYS ==="

          Get-ChildItem `
            -Path . `
            -Recurse `
            -Include *.sys |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== EXE ==="

          Get-ChildItem `
            -Path . `
            -Recurse `
            -Include *.exe |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== CAT ==="

          Get-ChildItem `
            -Path . `
            -Recurse `
            -Include *.cat |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== ZIP ==="

          Get-Item `
            "AodFreeze-package.zip" |
            Select-Object FullName, Length

      # ============================================================
      # 15. UPLOAD
      # ============================================================

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
