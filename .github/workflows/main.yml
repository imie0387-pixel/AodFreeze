name: Build AodFreeze - Test Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inspect runner and source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== RUNNER ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber

          Write-Host "=== WINDOWS KITS ==="
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

          if (-not (Test-Path $kits)) {
            throw "Windows Kits 10 not found: $kits"
          }

          Get-ChildItem "$kits\bin" -Directory |
            Select-Object FullName

          Write-Host "=== REQUIRED WDK BINARIES ==="

          $wdk = "$kits\bin\10.0.26100.0\x86"

          $required = @(
            "stampinf.exe",
            "inf2cat.exe",
            "drvcat.exe"
          )

          foreach ($name in $required) {
            $path = Join-Path $wdk $name

            if (-not (Test-Path $path)) {
              throw "Missing WDK tool: $path"
            }

            Write-Host "OK: $path"
          }

          Write-Host "=== SOURCE FILE CHECK ==="

          $sourceFiles = @(
            "DiskFilter\DiskFilter.vcxproj",
            "DiskFilter.sln",
            "DiskFilter\diskflt.inf"
          )

          foreach ($path in $sourceFiles) {
            if (-not (Test-Path $path)) {
              throw "Missing source file: $path"
            }

            Write-Host "OK: $path"
          }

      - name: Build driver x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if (-not (Test-Path "DiskFilter\x64\Release\diskflt.sys")) {
            throw "Driver build output missing: DiskFilter\x64\Release\diskflt.sys"
          }

          if (-not (Test-Path "DiskFilter\x64\Release\DiskFilter\diskflt.cat")) {
            throw "Driver build catalog missing: DiskFilter\x64\Release\DiskFilter\diskflt.cat"
          }

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item DistDriver -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path DistDriver | Out-Null

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.inf" `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.cat" `
            "DistDriver\diskflt.cat" `
            -Force

          $required = @(
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "DistDriver\diskflt.sys"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing DistDriver file: $path"
            }

            Write-Host "OK: $path"
          }

          Write-Host "=== DISTDRIVER CONTENTS ==="

          Get-ChildItem DistDriver -Recurse |
            Select-Object FullName, Length

      - name: Build management tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          $tools = @(
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe"
          )

          foreach ($path in $tools) {
            if (-not (Test-Path $path)) {
              throw "Management tool build output missing: $path"
            }

            Write-Host "OK: $path"
          }

      - name: Locate SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $candidates = Get-ChildItem `
            $root `
            -Recurse `
            -Filter signtool.exe `
            -File |
            Sort-Object FullName -Descending

          if (-not $candidates) {
            throw "signtool.exe not found under $root"
          }

          $selected = $candidates |
            Where-Object {
              $_.FullName -match "\\10\.0\.26100\.0\\x64\\signtool\.exe$"
            } |
            Select-Object -First 1

          if (-not $selected) {
            $selected = $candidates | Select-Object -First 1
          }

          "SIGNTOOL=$($selected.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Selected SignTool: $($selected.FullName)"

          & $selected.FullName /?

      - name: Create test code-signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $subject = "CN=AodFreeze Test Certificate"

          $existing = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object {
              $_.Subject -eq $subject
            }

          if ($existing) {
            $existing | Remove-Item -Force
          }

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation "Cert:\LocalMachine\My" `
            -NotAfter (Get-Date).AddYears(13)

          if (-not $cert) {
            throw "Failed to create test code-signing certificate."
          }

          "CERT_THUMBPRINT=$($cert.Thumbprint)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Export-Certificate `
            -Cert $cert `
            -FilePath "AodFreeze-Test.cer" `
            -Type CERT |
            Out-Null

          if (-not (Test-Path "AodFreeze-Test.cer")) {
            throw "Certificate export failed."
          }

          Write-Host "Certificate subject: $($cert.Subject)"
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          Write-Host "Certificate expiration: $($cert.NotAfter)"

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DistDriver\diskflt.sys"
          )

          foreach ($path in $sysFiles) {
            if (-not (Test-Path $path)) {
              throw "Missing SYS before signing: $path"
            }

            Write-Host "Signing: $path"

            & $env:SIGNTOOL sign `
              /v `
              /fd sha256 `
              /sm `
              /s My `
              /sha1 $env:CERT_THUMBPRINT `
              $path

            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed for $path with exit code $LASTEXITCODE"
            }

            Write-Host "SIGN OK: $path"
          }

      - name: Trust test certificate on runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Import-Certificate `
            -FilePath "AodFreeze-Test.cer" `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath "AodFreeze-Test.cer" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

          Write-Host "Test certificate imported into Root and TrustedPublisher."

      - name: Verify driver signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = "DistDriver\diskflt.sys"

          Write-Host "Verifying: $path"

          & $env:SIGNTOOL verify /v /kp $path

          if ($LASTEXITCODE -ne 0) {
            throw "Kernel-mode signature verification failed for $path"
          }

          $signature = Get-AuthenticodeSignature $path

          if ($signature.Status -ne "Valid") {
            throw "PowerShell signature verification failed for $path: $($signature.Status)"
          }

          Write-Host "DRIVER SIGNATURE OK."

      - name: Verify build-generated catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $catalog = "DistDriver\diskflt.cat"

          if (-not (Test-Path $catalog)) {
            throw "Catalog missing: $catalog"
          }

          Write-Host "Catalog:"

          Get-Item $catalog |
            Select-Object FullName, Length

          Write-Host "The catalog generated by the driver build will be signed."
          Write-Host "No second manual Inf2Cat invocation is performed."

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & $env:SIGNTOOL sign `
            /v `
            /fd sha256 `
            /sm `
            /s My `
            /sha1 $env:CERT_THUMBPRINT `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog signing failed with exit code $LASTEXITCODE"
          }

          Write-Host "CATALOG SIGN OK."

      - name: Verify catalog and package relationship
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== VERIFY CATALOG SIGNATURE ==="

          & $env:SIGNTOOL verify `
            /v `
            /kp `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog kernel-policy signature verification failed."
          }

          Write-Host "=== VERIFY INF AGAINST CATALOG ==="

          & $env:SIGNTOOL verify `
            /v `
            /kp `
            /c "DistDriver\diskflt.cat" `
            "DistDriver\diskflt.inf"

          if ($LASTEXITCODE -ne 0) {
            throw "INF/catalog verification failed."
          }

          Write-Host "=== VERIFY SYS AGAINST CATALOG ==="

          & $env:SIGNTOOL verify `
            /v `
            /kp `
            /c "DistDriver\diskflt.cat" `
            "DistDriver\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            throw "SYS/catalog verification failed."
          }

          Write-Host "CAT + INF + SYS RELATIONSHIP OK."

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "AodFreeze-package.zip" `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools" |
            Out-Null

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.sys" `
            "$package\Driver\diskflt.sys" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          Copy-Item `
            "AodFreeze-Test.cer" `
            "$package\AodFreeze-Test.cer" `
            -Force

          @"
          AodFreeze
          ==========

          TEST-SIGNED BUILD

          Driver:
            Driver\diskflt.inf
            Driver\diskflt.cat
            Driver\diskflt.sys

          Tools:
            Tools\DiskfltInst.exe
            Tools\DiskfltBufmon.exe
            Tools\diskfltmgmt.exe
            Tools\cabarc.exe

          Certificate:
            AodFreeze-Test.cer

          Build:
            Release
            x64
            Windows Server 2022 runner
            WDK 10.0.26100.0

          Important:
            This package is TEST-SIGNED.

            On the Windows 11 test machine:

              1. Import AodFreeze-Test.cer into
                 Local Computer Trusted Root Certification Authorities.

              2. Import AodFreeze-Test.cer into
                 Local Computer Trusted Publishers.

              3. Disable Secure Boot.

              4. Enable Windows test signing with:

                 bcdedit /set testsigning on

              5. Reboot before installing/testing the driver.

          The certificate private key is not included in this package.

          This package contains the x64 driver build only.
          "@ |
            Set-Content "$package\README.txt" -Encoding UTF8

          $required = @(
            "$package\Driver\diskflt.inf",
            "$package\Driver\diskflt.cat",
            "$package\Driver\diskflt.sys",
            "$package\Tools\DiskfltInst.exe",
            "$package\Tools\DiskfltBufmon.exe",
            "$package\Tools\diskfltmgmt.exe",
            "$package\Tools\cabarc.exe",
            "$package\AodFreeze-Test.cer",
            "$package\README.txt"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Package file missing: $path"
            }

            Write-Host "PACKAGE OK: $path"
          }

          Write-Host "=== PACKAGE CONTENTS ==="

          Get-ChildItem $package -Recurse |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

          Write-Host "=== ZIP ==="

          Get-Item "AodFreeze-package.zip" |
            Select-Object FullName, Length

      - name: Final integrity check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "DistDriver\diskflt.sys",
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe",
            "AodFreeze-package.zip"
          )

          foreach ($path in $files) {
            if (-not (Test-Path $path)) {
              throw "Integrity-check file missing: $path"
            }

            Write-Host "=== SHA256 ==="

            Get-FileHash `
              $path `
              -Algorithm SHA256 |
              Select-Object Algorithm, Hash, Path
          }

          Write-Host "=== FINAL DRIVER SIGNATURE STATUS ==="

          $signature = Get-AuthenticodeSignature `
            "DistDriver\diskflt.sys"

          $signature |
            Select-Object `
              Status,
              StatusMessage,
              Path,
              SignerCertificate

          if ($signature.Status -ne "Valid") {
            throw "Final driver signature is not valid."
          }

          Write-Host "=== FINAL CATALOG SIGNATURE STATUS ==="

          $catSignature = Get-AuthenticodeSignature `
            "DistDriver\diskflt.cat"

          $catSignature |
            Select-Object `
              Status,
              StatusMessage,
              Path,
              SignerCertificate

          if ($catSignature.Status -ne "Valid") {
            throw "Final catalog signature is not valid."
          }

      - name: Upload AodFreeze package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test-package
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
