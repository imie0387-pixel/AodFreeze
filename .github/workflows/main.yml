name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install v141_xp toolset
        shell: powershell
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          & $setup modify `
            --quiet `
            --norestart `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.Component.WinXP

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Visual Studio installer returned: $LASTEXITCODE"
          }

      - name: Build solution
        run: |
          msbuild DiskFilter.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.sys,*.exe |
            Select-Object FullName,Length
