name: Build AodFreeze - Microsoft Attestation

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: aodfreeze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 / WinXP / v141 MFC support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          if (-not (Test-Path $setup)) {
            throw "Visual Studio setup.exe not found: $setup"
          }

          $vsPath = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath |
            Select-Object -First 1).Trim()

          if (-not $vsPath) {
            throw "Visual Studio installation path could not be detected."
          }

          $v141Id = 'Microsoft.VisualStudio.Component.VC.v141.x86.x64'
          $mfcId  = 'Microsoft.VisualStudio.Component.VC.v141.MFC'
          $xpId   = 'Microsoft.VisualStudio.Component.WinXP'

          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'

          function Test-V141Files {
            $dirs = @(
              Get-ChildItem $msvcRoot -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like '14.16*' }
            )

            $cl = $null
            $afx = $null

            foreach ($dir in $dirs) {
              foreach ($hostArch in @('HostX86', 'Hostx64')) {
                foreach ($targetArch in @('x64', 'x86')) {
                  $candidate = Join-Path $dir.FullName "bin\$hostArch\$targetArch\cl.exe"

                  if (-not $cl -and (Test-Path $candidate)) {
                    $cl = Get-Item $candidate
                  }
                }
              }

              $afxCandidate = Join-Path $dir.FullName 'atlmfc\include\afxwin.h'

              if (-not $afx -and (Test-Path $afxCandidate)) {
                $afx = Get-Item $afxCandidate
              }
            }

            return [pscustomobject]@{
              Cl     = $cl
              Afxwin = $afx
            }
          }

          $files = Test-V141Files

          $v141Installed = [bool](
            & $vswhere -latest -products * `
              -requires $v141Id `
              -property installationPath 2>$null
          )

          $mfcInstalled = [bool](
            & $vswhere -latest -products * `
              -requires $mfcId `
              -property installationPath 2>$null
          )

          $xpInstalled = [bool](
            & $vswhere -latest -products * `
              -requires $xpId `
              -property installationPath 2>$null
          )

          Write-Host "VS: $vsPath"
          Write-Host "v141 component: $v141Installed"
          Write-Host "v141 MFC component: $mfcInstalled"
          Write-Host "WinXP component: $xpInstalled"
          Write-Host "v141 cl.exe: $($files.Cl.FullName)"
          Write-Host "afxwin.h: $($files.Afxwin.FullName)"

          if (
            -not $v141Installed -or
            -not $mfcInstalled -or
            -not $xpInstalled -or
            -not $files.Cl -or
            -not $files.Afxwin
          ) {
            foreach ($componentId in @($v141Id, $mfcId, $xpId)) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $setup
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true

              foreach ($arg in @(
                'modify',
                '--installPath',
                $vsPath,
                '--channelId',
                'VisualStudio.17.Release',
                '--add',
                $componentId,
                '--quiet',
                '--norestart'
              )) {
                [void]$psi.ArgumentList.Add($arg)
              }

              $process = [System.Diagnostics.Process]::Start($psi)

              if (-not $process) {
                throw "Failed to start VS Installer for $componentId"
              }

              $process.WaitForExit()

              if ($process.ExitCode -notin @(0, 3010, 1641)) {
                throw "VS component installation failed for ${componentId}: $($process.ExitCode)"
              }
            }
          }

          Start-Sleep -Seconds 3

          $files = Test-V141Files

          if (-not $files.Cl) {
            throw 'v141 cl.exe was not found after installation.'
          }

          if (-not $files.Afxwin) {
            throw 'v141 afxwin.h was not found after installation.'
          }

          Write-Host "v141 verified: $($files.Cl.FullName)"
          Write-Host "MFC verified: $($files.Afxwin.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $PWD 'DiskFilter\DiskFilter.vcxproj'

          if (-not (Test-Path $project)) {
            throw "Driver project not found: $project"
          }

          & msbuild $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare DistDriver for solution build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $PWD 'DistDriver'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path `
              $dist, `
              "$dist\amd64", `
              "$dist\i386" |
            Out-Null

          $sys = Join-Path $PWD 'DiskFilter\x64\Release\diskflt.sys'
          $inf = Join-Path $PWD 'DiskFilter\x64\Release\DiskFilter\diskflt.inf'
          $cat = Join-Path $PWD 'DiskFilter\x64\Release\DiskFilter\diskflt.cat'

          foreach ($file in @($sys, $inf, $cat)) {
            if (-not (Test-Path $file)) {
              throw "Required build output not found: $file"
            }
          }

          Copy-Item $sys $dist -Force
          Copy-Item $inf $dist -Force
          Copy-Item $cat $dist -Force

          Copy-Item $sys "$dist\amd64\diskflt.sys" -Force
          Copy-Item $sys "$dist\i386\diskflt.sys" -Force

      - name: Build full solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $solution = Join-Path $PWD 'DiskFilter.sln'

          if (-not (Test-Path $solution)) {
            throw "Solution not found: $solution"
          }

          & msbuild $solution `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Solution build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare Microsoft attestation submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $submission = Join-Path $PWD 'AttestationSubmission'
          $driverDir = Join-Path $submission 'amd64'

          if (Test-Path $submission) {
            Remove-Item $submission -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $driverDir |
            Out-Null

          $sys = Join-Path $PWD 'DiskFilter\x64\Release\diskflt.sys'
          $inf = Join-Path $PWD 'DiskFilter\x64\Release\DiskFilter\diskflt.inf'
          $pdb = Join-Path $PWD 'DiskFilter\x64\Release\diskflt.pdb'

          foreach ($file in @($sys, $inf, $pdb)) {
            if (-not (Test-Path $file)) {
              throw "Attestation input not found: $file"
            }
          }

          Copy-Item $sys $driverDir -Force
          Copy-Item $inf $driverDir -Force
          Copy-Item $pdb $driverDir -Force

          Write-Host '=== ATTESTATION INPUT ==='

          Get-ChildItem $submission -Recurse -File |
            Select-Object FullName, Length

      - name: Locate Inf2Cat and MakeCab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $inf2cat = Join-Path `
            $kits `
            '10.0.26100.0\x86\Inf2Cat.exe'

          if (-not (Test-Path $inf2cat)) {
            $inf2cat = Get-ChildItem `
              $kits `
              -Filter Inf2Cat.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $inf2cat) {
            throw 'Inf2Cat.exe not found.'
          }

          $makecab = "$env:windir\System32\makecab.exe"

          if (-not (Test-Path $makecab)) {
            throw "makecab.exe not found: $makecab"
          }

          "INF2CAT_PATH=$inf2cat" >> $env:GITHUB_ENV
          "MAKECAB_PATH=$makecab" >> $env:GITHUB_ENV

      - name: Generate attestation catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $submission = Join-Path $PWD 'AttestationSubmission'

          & $env:INF2CAT_PATH `
            /driver:"$submission" `
            /os:10_x64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE"
          }

          $cat = Join-Path `
            $submission `
            'amd64\diskflt.cat'

          if (-not (Test-Path $cat)) {
            throw "Inf2Cat did not create: $cat"
          }

      - name: Create attestation CAB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $submission = Join-Path $PWD 'AttestationSubmission'
          $ddf = Join-Path $env:RUNNER_TEMP 'AodFreeze-attestation.ddf'
          $cab = Join-Path $PWD 'AodFreeze-attestation.cab'

          @"
          .OPTION EXPLICIT
          .Set CabinetNameTemplate=AodFreeze-attestation.cab
          .Set DiskDirectoryTemplate=.
          .Set Cabinet=on
          .Set Compress=on
          .Set CompressionType=LZX
          .Set MaxDiskSize=0
          .Set SourceDir=$submission
          amd64\diskflt.sys
          amd64\diskflt.inf
          amd64\diskflt.pdb
          amd64\diskflt.cat
          "@ |
            Set-Content $ddf -Encoding ASCII

          Push-Location (Split-Path $cab -Parent)

          & $env:MAKECAB_PATH /F $ddf

          Pop-Location

          if ($LASTEXITCODE -ne 0) {
            throw "makecab failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $cab)) {
            throw "CAB was not created: $cab"
          }

      - name: Optional EV-sign attestation CAB
        shell: pwsh
        env:
          EV_PFX_BASE64: ${{ secrets.EV_PFX_BASE64 }}
          EV_PFX_PASSWORD: ${{ secrets.EV_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            [string]::IsNullOrWhiteSpace($env:EV_PFX_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:EV_PFX_PASSWORD)
          ) {
            Write-Host 'EV secrets are not configured; leaving CAB unsigned for manual EV signing.'
            exit 0
          }

          $pfx = Join-Path `
            $env:RUNNER_TEMP `
            'aodfreeze-ev.pfx'

          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:EV_PFX_BASE64)
          )

          $securePassword = ConvertTo-SecureString `
            $env:EV_PFX_PASSWORD `
            -AsPlainText `
            -Force

          $cert = Import-PfxCertificate `
            -FilePath $pfx `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $securePassword

          if (-not $cert) {
            throw 'EV certificate import failed.'
          }

          $signtool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -match '\\x64\\signtool\.exe$'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            throw 'signtool.exe not found.'
          }

          & $signtool `
            sign `
            /v `
            /fd sha256 `
            /tr https://timestamp.digicert.com `
            /td sha256 `
            /sha1 $cert.Thumbprint `
            'AodFreeze-attestation.cab'

          if ($LASTEXITCODE -ne 0) {
            throw "EV CAB signing failed with exit code $LASTEXITCODE"
          }

          Write-Host 'EV-signed CAB created: AodFreeze-attestation.cab'

      - name: Create submission README
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @"
          AodFreeze Microsoft Attestation Submission

          Contents:
            AodFreeze-attestation.cab
            AttestationSubmission\amd64\diskflt.sys
            AttestationSubmission\amd64\diskflt.inf
            AttestationSubmission\amd64\diskflt.pdb
            AttestationSubmission\amd64\diskflt.cat

          This build intentionally does NOT create or use a test certificate.

          It is intended for Microsoft Hardware Dev Center attestation signing.

          Required production flow:
            1. Sign AodFreeze-attestation.cab with the registered EV certificate.
            2. Submit the EV-signed CAB in Microsoft Partner Center Hardware.
            3. Leave test signing disabled in the requested production signature flow.
            4. Download the Microsoft-signed driver package returned by Microsoft.
            5. Use the Microsoft-signed diskflt.sys and catalog for deployment.

          Do not enable TESTSIGNING for the production-signed package.
          "@ |
            Set-Content 'ATTESTATION-README.txt' -Encoding UTF8

      - name: Final checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'AodFreeze-attestation.cab',
            'AttestationSubmission\amd64\diskflt.sys',
            'AttestationSubmission\amd64\diskflt.inf',
            'AttestationSubmission\amd64\diskflt.pdb',
            'AttestationSubmission\amd64\diskflt.cat',
            'ATTESTATION-README.txt'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required output missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host '=== HASHES ==='

          Get-FileHash `
            'AttestationSubmission\amd64\diskflt.sys' `
            -Algorithm SHA256

          Get-FileHash `
            'AttestationSubmission\amd64\diskflt.cat' `
            -Algorithm SHA256

          Get-FileHash `
            'AodFreeze-attestation.cab' `
            -Algorithm SHA256

      - name: Upload attestation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-attestation
          path: |
            AodFreeze-attestation.cab
            AttestationSubmission
            ATTESTATION-README.txt
          if-no-files-found: error
          retention-days: 14
