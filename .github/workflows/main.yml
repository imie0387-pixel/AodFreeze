name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Install Windows 11 SDK 26100
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.Windows11SDK.26100

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Preflight environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== RUNNER ==="
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber |
            Format-List

          $kitsCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10"),
            (Join-Path $env:ProgramFiles "Windows Kits\10")
          )

          $kitsRoots = @(
            $kitsCandidates |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -Unique
          )

          if ($kitsRoots.Count -eq 0) {
            throw "Windows Kits 10 root not found."
          }

          Write-Host "=== WINDOWS KITS ==="
          $kitsRoots |
            ForEach-Object {
              Write-Host $_
            }

          $binRoots = @(
            $kitsRoots |
              ForEach-Object {
                Join-Path $_ "bin"
              } |
              Where-Object {
                Test-Path $_
              }
          )

          if ($binRoots.Count -eq 0) {
            throw "Windows Kits bin directory not found."
          }

          Write-Host "=== SDK/WDK BIN DIRECTORIES ==="

          foreach ($binRoot in $binRoots) {
            Get-ChildItem $binRoot -Directory |
              Sort-Object FullName |
              Select-Object FullName
          }

          Write-Host "=== SOURCE FILE CHECK ==="

          $required = @(
            "DiskFilter\DiskFilter.vcxproj",
            "DiskFilter.sln",
            "DiskFilter\diskflt.inf"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required source file missing: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Build driver x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== BUILD DRIVER X64 ==="

          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed."
          }

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== PREPARE DISTDRIVER ==="

          Remove-Item `
            "DistDriver" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\i386" |
            Out-Null

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.inf" `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.cat" `
            "DistDriver\diskflt.cat" `
            -Force

          $required = @(
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Build output missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host "=== DISTDRIVER CONTENTS ==="

          Get-ChildItem `
            "DistDriver" `
            -Recurse |
            Select-Object FullName,Length

      - name: Build management tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== BUILD MANAGEMENT TOOLS ==="

          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Management tools build failed."
          }

      - name: Locate x64 SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== LOCATE SIGNTOOL ==="

          $kitsRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10"),
            (Join-Path $env:ProgramFiles "Windows Kits\10")
          ) |
            Where-Object {
              $_ -and (Test-Path $_)
            } |
            Select-Object -Unique

          if ($kitsRoots.Count -eq 0) {
            throw "Windows Kits 10 root not found while locating SignTool."
          }

          $candidates = @()

          foreach ($root in $kitsRoots) {
            $bin = Join-Path $root "bin"

            if (Test-Path $bin) {
              $candidates += Get-ChildItem `
                -Path $bin `
                -Recurse `
                -File `
                -Filter "signtool.exe" `
                -ErrorAction SilentlyContinue
            }
          }

          $candidates = @(
            $candidates |
              Sort-Object FullName -Unique
          )

          Write-Host "=== SIGNTOOL CANDIDATES ==="

          foreach ($item in $candidates) {
            Write-Host $item.FullName
          }

          $signtool = $candidates |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            $signtool = $candidates |
              Where-Object {
                $_.FullName -match "\\x86\\signtool\.exe$"
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $signtool) {
            throw "No usable x64/x86 signtool.exe was found."
          }

          Write-Host "=== SELECTED SIGNTOOL ==="
          Write-Host $signtool.FullName

          if ($signtool.FullName -match "\\arm64\\") {
            throw "ARM64 SignTool was selected. This is explicitly forbidden."
          }

          & $signtool.FullName /? |
            Out-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Selected SignTool could not be executed."
          }

          "SIGNTOOL=$($signtool.FullName)" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Prepare test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== CREATE TEST CERTIFICATE ==="

          $certDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Signing"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $certDir |
            Out-Null

          $cerPath = Join-Path `
            $certDir `
            "AodFreeze-Test.cer"

          Get-ChildItem `
            "Cert:\CurrentUser\My" |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            } |
            Remove-Item `
              -Force `
              -ErrorAction SilentlyContinue

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AodFreeze Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(13)

          if (-not $cert) {
            throw "Could not create test certificate."
          }

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath `
            -Force |
            Out-Null

          if (-not (Test-Path $cerPath)) {
            throw "Test certificate export failed."
          }

          Write-Host "Certificate subject:"
          Write-Host $cert.Subject

          Write-Host "Certificate thumbprint:"
          Write-Host $cert.Thumbprint

          Write-Host "Certificate expiration:"
          Write-Host $cert.NotAfter

          "CERT_THUMBPRINT=$($cert.Thumbprint)" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "CER_PATH=$cerPath" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SIGN DRIVER SYS ==="

          if (-not $env:CERT_THUMBPRINT) {
            throw "Certificate thumbprint is missing."
          }

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            if (-not (Test-Path $sys)) {
              throw "Driver file missing: $sys"
            }

            Write-Host ""
            Write-Host "Signing:"
            Write-Host $sys

            & "$env:SIGNTOOL" sign `
              /v `
              /fd SHA256 `
              /sha1 $env:CERT_THUMBPRINT `
              "$sys"

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $sys"
            }

            Write-Host "SIGN OK: $sys"
          }

      - name: Trust test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== TRUST TEST CERTIFICATE ==="

          if (-not (Test-Path "$env:CER_PATH")) {
            throw "Certificate file missing: $env:CER_PATH"
          }

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

          Write-Host "Certificate imported into:"
          Write-Host "  LocalMachine\Root"
          Write-Host "  LocalMachine\TrustedPublisher"

      - name: Verify driver signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== VERIFY DRIVER SIGNATURES ==="

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            Write-Host ""
            Write-Host "Verifying:"
            Write-Host $sys

            & "$env:SIGNTOOL" verify `
              /v `
              /pa `
              "$sys"

            if ($LASTEXITCODE -ne 0) {
              throw "Driver signature verification failed: $sys"
            }

            $sig = Get-AuthenticodeSignature $sys

            if ($sig.Status -ne "Valid") {
              throw "PowerShell signature status is not Valid for $sys. Status=$($sig.Status)"
            }

            if ($sig.SignerCertificate.Subject -ne "CN=AodFreeze Test Certificate") {
              throw "Unexpected signer certificate for $sys."
            }

            Write-Host "VERIFY OK: $sys"
          }

      - name: Verify build-generated catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== VERIFY BUILD-GENERATED CATALOG ==="

          $cat = "DistDriver\diskflt.cat"

          if (-not (Test-Path $cat)) {
            throw "Build-generated catalog is missing: $cat"
          }

          $catInfo = Get-Item $cat

          Write-Host "Catalog:"
          Write-Host $catInfo.FullName

          Write-Host "Size:"
          Write-Host $catInfo.Length

          if ($catInfo.Length -le 0) {
            throw "Catalog is empty."
          }

          Write-Host ""
          Write-Host "The catalog generated by the driver build will be signed."
          Write-Host "No second manual Inf2Cat invocation is performed."

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SIGN CATALOG ==="

          $cat = "DistDriver\diskflt.cat"

          if (-not (Test-Path $cat)) {
            throw "Catalog missing: $cat"
          }

          & "$env:SIGNTOOL" sign `
            /v `
            /fd SHA256 `
            /sha1 $env:CERT_THUMBPRINT `
            "$cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog signing failed."
          }

          Write-Host "CATALOG SIGN OK."

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== VERIFY CATALOG SIGNATURE ==="

          $cat = "DistDriver\diskflt.cat"

          & "$env:SIGNTOOL" verify `
            /v `
            /pa `
            "$cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Catalog signature verification failed."
          }

          $sig = Get-AuthenticodeSignature $cat

          if ($sig.Status -ne "Valid") {
            throw "PowerShell catalog signature status is not Valid. Status=$($sig.Status)"
          }

          if ($sig.SignerCertificate.Subject -ne "CN=AodFreeze Test Certificate") {
            throw "Unexpected signer certificate for catalog."
          }

          Write-Host "CATALOG VERIFY OK."

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== PREPARE AODFREEZE PACKAGE ==="

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools" |
            Out-Null

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          Copy-Item `
            "$env:CER_PATH" `
            "$package\AodFreeze-Test.cer" `
            -Force

          $readme = @(
            "AodFreeze"
            "========="
            ""
            "TEST BUILD"
            ""
            "Driver:"
            "  Driver\diskflt.inf"
            "  Driver\diskflt.cat"
            "  Driver\amd64\diskflt.sys"
            "  Driver\i386\diskflt.sys"
            ""
            "Tools:"
            "  Tools\DiskfltInst.exe"
            "  Tools\DiskfltBufmon.exe"
            "  Tools\diskfltmgmt.exe"
            "  Tools\cabarc.exe"
            ""
            "Test certificate:"
            "  AodFreeze-Test.cer"
            ""
            "Target:"
            "  Windows 11 25H2 x64"
            ""
            "Signing:"
            "  SHA256"
            "  Self-signed TEST certificate"
            ""
            "IMPORTANT:"
            "This package contains a TEST-SIGNED kernel driver."
            ""
            "For testing:"
            "1. Enable Windows test signing."
            "2. Install AodFreeze-Test.cer into Local Machine\Trusted Root Certification Authorities."
            "3. Install AodFreeze-Test.cer into Local Machine\Trusted Publishers."
            "4. Install the driver package with DiskfltInst.exe."
            ""
            "This is NOT a production/Microsoft-signed driver package."
            ""
            "This package was built by GitHub Actions."
          )

          $readme |
            Set-Content `
              "$package\README.txt" `
              -Encoding UTF8

          $expected = @(
            "$package\Driver\diskflt.inf"
            "$package\Driver\diskflt.cat"
            "$package\Driver\amd64\diskflt.sys"
            "$package\Driver\i386\diskflt.sys"
            "$package\Tools\DiskfltInst.exe"
            "$package\Tools\DiskfltBufmon.exe"
            "$package\Tools\diskfltmgmt.exe"
            "$package\Tools\cabarc.exe"
            "$package\AodFreeze-Test.cer"
            "$package\README.txt"
          )

          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Package file missing: $file"
            }

            Write-Host "PACKAGE OK: $file"
          }

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

          if (-not (Test-Path "AodFreeze-package.zip")) {
            throw "AodFreeze-package.zip was not created."
          }

          Write-Host "=== PACKAGE CONTENTS ==="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName,Length

      - name: Final integrity check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== FINAL INTEGRITY CHECK ==="

          $files = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys",
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe",
            "AodFreeze-package.zip"
          )

          foreach ($file in $files) {

            if (-not (Test-Path $file)) {
              throw "Final file missing: $file"
            }

            Write-Host ""
            Write-Host "=== SHA256 ==="
            Write-Host $file

            Get-FileHash `
              $file `
              -Algorithm SHA256
          }

          Write-Host ""
          Write-Host "=== FINAL DRIVER SIGNATURE STATUS ==="

          Get-AuthenticodeSignature `
            "DistDriver\amd64\diskflt.sys" |
            Format-List `
              Status,
              StatusMessage,
              Path,
              SignerCertificate

          Get-AuthenticodeSignature `
            "DistDriver\i386\diskflt.sys" |
            Format-List `
              Status,
              StatusMessage,
              Path,
              SignerCertificate

          Write-Host ""
          Write-Host "=== FINAL CATALOG SIGNATURE STATUS ==="

          Get-AuthenticodeSignature `
            "DistDriver\diskflt.cat" |
            Format-List `
              Status,
              StatusMessage,
              Path,
              SignerCertificate

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test-package
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
