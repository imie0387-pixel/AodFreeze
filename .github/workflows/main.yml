name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Install Windows 11 SDK 26100
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.Windows11SDK.26100

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Preflight Windows Kits and WDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "WINDOWS SDK / WDK CHECK"
          Write-Host "=============================================="

          $kitsRoot = $null

          $regPaths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots",
            "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots"
          )

          foreach ($regPath in $regPaths) {
            if (Test-Path $regPath) {
              $value = (
                Get-ItemProperty `
                  -Path $regPath `
                  -Name KitsRoot10 `
                  -ErrorAction SilentlyContinue
              ).KitsRoot10

              if ($value -and (Test-Path $value)) {
                $kitsRoot = $value.TrimEnd('\')
                break
              }
            }
          }

          if (-not $kitsRoot) {
            $pf86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")

            $candidates = @(
              (Join-Path $pf86 "Windows Kits\10"),
              (Join-Path $env:ProgramFiles "Windows Kits\10")
            )

            $kitsRoot = $candidates |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1
          }

          if (-not $kitsRoot) {
            throw "Windows Kits 10 directory not found."
          }

          Write-Host ""
          Write-Host "Windows Kits root:"
          Write-Host $kitsRoot

          $binRoot = Join-Path $kitsRoot "bin"

          if (-not (Test-Path $binRoot)) {
            throw "Windows Kits bin directory not found: $binRoot"
          }

          $requiredBin = Join-Path $binRoot "10.0.26100.0"

          if (-not (Test-Path $requiredBin)) {
            throw "Required Windows Kit 10.0.26100.0 not found: $requiredBin"
          }

          Write-Host ""
          Write-Host "Required WDK/SDK directory:"
          Write-Host $requiredBin

          Write-Host ""
          Write-Host "Available tool architectures:"

          Get-ChildItem `
            $requiredBin `
            -Directory |
            Sort-Object Name |
            Select-Object Name, FullName

          # IMPORTANT:
          # The GitHub runner is x64.
          # Never automatically select arm64 SignTool.
          $signtool = Join-Path `
            $requiredBin `
            "x64\signtool.exe"

          # Use the x86 Inf2Cat variant that was already known
          # to work with this WDK on the GitHub runner.
          $inf2cat = Join-Path `
            $requiredBin `
            "x86\inf2cat.exe"

          Write-Host ""
          Write-Host "Selected SignTool:"
          Write-Host $signtool

          Write-Host ""
          Write-Host "Selected Inf2Cat:"
          Write-Host $inf2cat

          if (-not (Test-Path $signtool)) {
            throw "Required x64 SignTool not found: $signtool"
          }

          if (-not (Test-Path $inf2cat)) {
            throw "Required x86 Inf2Cat not found: $inf2cat"
          }

          Write-Host ""
          Write-Host "Testing SignTool executable..."

          & $signtool /?

          if ($LASTEXITCODE -ne 0) {
            throw "x64 SignTool could not be executed."
          }

          Write-Host ""
          Write-Host "Testing Inf2Cat executable..."

          & $inf2cat /?

          if ($LASTEXITCODE -ne 0) {
            throw "x86 Inf2Cat could not be executed."
          }

          "KITS_ROOT=$kitsRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "INF2CAT=$inf2cat" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SIGNTOOL=$signtool" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "WINDOWS SDK / WDK CHECK OK."

      - name: Build driver x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "BUILD DRIVER X64"
          Write-Host "=============================================="

          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed."
          }

          if (-not (Test-Path "DiskFilter\x64\Release\diskflt.sys")) {
            throw "diskflt.sys was not produced."
          }

          Write-Host ""
          Write-Host "Driver build OK."

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "PREPARE DISTDRIVER"
          Write-Host "=============================================="

          Remove-Item `
            "DistDriver" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\i386" |
            Out-Null

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.inf" `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.cat" `
            "DistDriver\diskflt.cat" `
            -Force

          Write-Host ""
          Write-Host "DistDriver contents:"

          Get-ChildItem `
            "DistDriver" `
            -Recurse |
            Select-Object FullName, Length

          foreach ($file in @(
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )) {
            if (-not (Test-Path $file)) {
              throw "Required DistDriver file missing: $file"
            }
          }

          Write-Host ""
          Write-Host "DistDriver OK."

      - name: Build management tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "BUILD MANAGEMENT TOOLS"
          Write-Host "=============================================="

          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Management tools build failed."
          }

          foreach ($file in @(
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe"
          )) {
            if (-not (Test-Path $file)) {
              throw "Required tool missing: $file"
            }
          }

          Write-Host ""
          Write-Host "Management tools build OK."

      - name: Create test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CREATE TEST CERTIFICATE"
          Write-Host "=============================================="

          $signingDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Signing"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $signingDir |
            Out-Null

          $pfxPath = Join-Path `
            $signingDir `
            "AodFreeze-Test.pfx"

          $cerPath = Join-Path `
            $signingDir `
            "AodFreeze-Test.cer"

          $passwordText = "AodFreeze-Test-2026!"

          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          Get-ChildItem `
            "Cert:\CurrentUser\My" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate"
            } |
            Remove-Item `
              -Force `
              -ErrorAction SilentlyContinue

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AodFreeze Test Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(13)

          if (-not $cert) {
            throw "Test certificate creation failed."
          }

          Write-Host ""
          Write-Host "Certificate subject:"
          Write-Host $cert.Subject

          Write-Host ""
          Write-Host "Certificate thumbprint:"
          Write-Host $cert.Thumbprint

          Write-Host ""
          Write-Host "Certificate expiration:"
          Write-Host $cert.NotAfter

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath `
            -Force |
            Out-Null

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfxPath `
            -Password $password `
            -Force |
            Out-Null

          if (-not (Test-Path $pfxPath)) {
            throw "PFX was not created."
          }

          if (-not (Test-Path $cerPath)) {
            throw "CER was not created."
          }

          "PFX_PATH=$pfxPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "CER_PATH=$cerPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "PFX_PASSWORD=$passwordText" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Test certificate created."

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "SIGN DRIVER SYS"
          Write-Host "=============================================="

          if (-not (Test-Path "$env:SIGNTOOL")) {
            throw "SignTool not found: $env:SIGNTOOL"
          }

          if (-not (Test-Path "$env:PFX_PATH")) {
            throw "PFX not found: $env:PFX_PATH"
          }

          Write-Host ""
          Write-Host "Using x64 SignTool:"
          Write-Host $env:SIGNTOOL

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            if (-not (Test-Path $sys)) {
              throw "SYS file not found: $sys"
            }

            Write-Host ""
            Write-Host "Signing:"
            Write-Host $sys

            & "$env:SIGNTOOL" `
              sign `
              /v `
              /fd SHA256 `
              /f "$env:PFX_PATH" `
              /p "$env:PFX_PASSWORD" `
              "$sys"

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $sys"
            }

            Write-Host ""
            Write-Host "SIGN OK:"
            Write-Host $sys
          }

      - name: Trust test certificate on build runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "TRUST TEST CERTIFICATE"
          Write-Host "=============================================="

          if (-not (Test-Path "$env:CER_PATH")) {
            throw "Certificate file not found: $env:CER_PATH"
          }

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath "$env:CER_PATH" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

          Write-Host ""
          Write-Host "Certificate imported into Trusted Root."
          Write-Host "Certificate imported into Trusted Publishers."

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "VERIFY EMBEDDED SYS SIGNATURES"
          Write-Host "=============================================="

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($sys in $sysFiles) {

            Write-Host ""
            Write-Host "VERIFY:"
            Write-Host $sys

            & "$env:SIGNTOOL" `
              verify `
              /v `
              /pa `
              "$sys"

            if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "SignTool /pa verification OK."
            }
            else {
              Write-Host ""
              Write-Host "Standard /pa verification returned non-zero."
              Write-Host "Checking Authenticode status..."

              $signature = Get-AuthenticodeSignature `
                -FilePath $sys

              Write-Host ""
              Write-Host "Authenticode status:"
              Write-Host $signature.Status

              if ($signature.Status -ne "Valid") {
                throw "Embedded signature is not valid for $sys. Status=$($signature.Status)"
              }

              Write-Host ""
              Write-Host "Embedded signature is VALID."
            }
          }

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "INF2CAT WINDOWS 11 25H2 X64"
          Write-Host "=============================================="

          $driverDir = (Resolve-Path "DistDriver").Path

          Write-Host ""
          Write-Host "Using Inf2Cat:"
          Write-Host $env:INF2CAT

          Write-Host ""
          Write-Host "Driver directory:"
          Write-Host $driverDir

          Write-Host ""
          Write-Host "Target:"
          Write-Host "Windows 11 25H2 x64"

          Write-Host ""
          Write-Host "OS identifier:"
          Write-Host "10_25H2_X64"

          & "$env:INF2CAT" `
            /driver:$driverDir `
            /os:10_25H2_X64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed."
          }

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File
          )

          if ($catFiles.Count -eq 0) {
            throw "Inf2Cat succeeded but no CAT file was generated."
          }

          Write-Host ""
          Write-Host "Generated catalog:"

          $catFiles |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "Inf2Cat OK."

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "SIGN CATALOG"
          Write-Host "=============================================="

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File
          )

          if ($catFiles.Count -eq 0) {
            throw "No catalog file found."
          }

          foreach ($cat in $catFiles) {

            Write-Host ""
            Write-Host "Signing catalog:"
            Write-Host $cat.FullName

            & "$env:SIGNTOOL" `
              sign `
              /v `
              /fd SHA256 `
              /f "$env:PFX_PATH" `
              /p "$env:PFX_PASSWORD" `
              "$($cat.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "Catalog signing failed for $($cat.FullName)"
            }

            Write-Host ""
            Write-Host "CATALOG SIGN OK."
          }

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "VERIFY CATALOG SIGNATURE"
          Write-Host "=============================================="

          $catFiles = @(
            Get-ChildItem `
              "DistDriver" `
              -Filter "*.cat" `
              -File
          )

          foreach ($cat in $catFiles) {

            Write-Host ""
            Write-Host "VERIFY:"
            Write-Host $cat.FullName

            & "$env:SIGNTOOL" `
              verify `
              /v `
              /pa `
              "$($cat.FullName)"

            if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "Catalog /pa verification OK."
            }
            else {
              $signature = Get-AuthenticodeSignature `
                -FilePath $cat.FullName

              Write-Host ""
              Write-Host "Authenticode status:"
              Write-Host $signature.Status

              if ($signature.Status -ne "Valid") {
                throw "Catalog signature is not valid: $($cat.FullName)"
              }

              Write-Host ""
              Write-Host "Embedded catalog signature is VALID."
            }
          }

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "PREPARE AODFREEZE PACKAGE"
          Write-Host "=============================================="

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools" |
            Out-Null

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          Copy-Item `
            "$env:CER_PATH" `
            "$package\AodFreeze-Test.cer" `
            -Force

          @"
AodFreeze
=========

TEST BUILD

Driver:
  Driver\diskflt.inf
  Driver\diskflt.cat
  Driver\amd64\diskflt.sys
  Driver\i386\diskflt.sys

Tools:
  Tools\DiskfltInst.exe
  Tools\DiskfltBufmon.exe
  Tools\diskfltmgmt.exe
  Tools\cabarc.exe

Test certificate:
  AodFreeze-Test.cer

Target:
  Windows 11 25H2 x64

Inf2Cat:
  /os:10_25H2_X64

Signing:
  SHA256
  Self-signed TEST certificate

IMPORTANT:
  This package contains a TEST-SIGNED kernel driver.

Before testing:
  1. Enable Windows Test Mode.
  2. Install AodFreeze-Test.cer into:
     Local Machine\Trusted Root Certification Authorities
  3. Install AodFreeze-Test.cer into:
     Local Machine\Trusted Publishers
  4. Install the driver package.

This is NOT a production/Microsoft-signed driver package.

This package was built by GitHub Actions.
"@ |
            Set-Content `
              "$package\README.txt" `
              -Encoding UTF8

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

          if (-not (Test-Path "AodFreeze-package.zip")) {
            throw "AodFreeze-package.zip was not created."
          }

          Write-Host ""
          Write-Host "Package contents:"

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

      - name: Final integrity and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "FINAL INTEGRITY CHECK"
          Write-Host "=============================================="

          $files = @(
            "DistDriver\diskflt.inf",
            "DistDriver\diskflt.cat",
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys",
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe",
            "AodFreeze-package.zip"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Required final file missing: $file"
            }
          }

          Write-Host ""
          Write-Host "SHA256:"
          Write-Host ""

          foreach ($file in @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys",
            "DistDriver\diskflt.cat",
            "AodFreeze-package.zip"
          )) {
            Get-FileHash `
              $file `
              -Algorithm SHA256
          }

          Write-Host ""
          Write-Host "FINAL CHECK OK."

      - name: Upload AodFreeze package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-package
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
