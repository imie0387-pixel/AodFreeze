name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 1. BUILD DRIVER
      # ============================================================

      - name: Build driver x64
        run: |
          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 2. PREPARE DistDriver
      #    Musi istnieć PRZED kompilacją programów instalacyjnych,
      #    ponieważ ich zasoby RC zawierają diskflt.sys.
      # ============================================================

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating DistDriver ==="

          Remove-Item "DistDriver" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "DistDriver"
          New-Item -ItemType Directory -Force -Path "DistDriver\amd64"
          New-Item -ItemType Directory -Force -Path "DistDriver\i386"

          $driver = "DiskFilter\x64\Release\diskflt.sys"
          $inf = "DiskFilter\x64\Release\DiskFilter\diskflt.inf"
          $cat = "DiskFilter\x64\Release\DiskFilter\diskflt.cat"

          if (!(Test-Path $driver)) {
            throw "BRAK: $driver"
          }

          if (!(Test-Path $inf)) {
            throw "BRAK: $inf"
          }

          if (!(Test-Path $cat)) {
            throw "BRAK: $cat"
          }

          Copy-Item `
            $driver `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            $driver `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            $inf `
            "DistDriver\diskflt.inf" `
            -Force

          Copy-Item `
            $cat `
            "DistDriver\diskflt.cat" `
            -Force

          Write-Host ""
          Write-Host "=== DistDriver contents ==="

          Get-ChildItem "DistDriver" -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # 3. BUILD MANAGEMENT TOOLS
      # ============================================================

      - name: Build management tools
        run: |
          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

      # ============================================================
      # 4. LOCATE SIGNING TOOLS
      # ============================================================

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse `
            -Filter "signtool.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          $makecert = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse `
            -Filter "makecert.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\makecert\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$signtool) {
            throw "Nie znaleziono signtool.exe"
          }

          if (!$makecert) {
            throw "Nie znaleziono makecert.exe"
          }

          Write-Host "signtool = $($signtool.FullName)"
          Write-Host "makecert = $($makecert.FullName)"

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "MAKECERT=$($makecert.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 5. CREATE TEST CERTIFICATE
      # ============================================================

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Creating test certificate ==="

          Remove-Item "AodFreezeTest.cer" -Force -ErrorAction SilentlyContinue
          Remove-Item "AodFreezeTest.pvk" -Force -ErrorAction SilentlyContinue
          Remove-Item "AodFreezeTest.pfx" -Force -ErrorAction SilentlyContinue

          & $env:MAKECERT `
            -r `
            -pe `
            -ss PrivateCertStore `
            -n "CN=AodFreeze Test Certificate" `
            -len 2048 `
            "AodFreezeTest.cer"

          if ($LASTEXITCODE -ne 0) {
            throw "makecert zakończył się błędem: $LASTEXITCODE"
          }

          Write-Host "Certificate created."

      # ============================================================
      # 6. SIGN DRIVER
      # ============================================================

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DiskFilter\x64\Release\diskflt.sys",
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $sysFiles) {

            if (!(Test-Path $file)) {
              throw "BRAK pliku do podpisania: $file"
            }

            Write-Host "Signing: $file"

            & $env:SIGNTOOL `
              sign `
              /v `
              /fd SHA256 `
              /a `
              /s PrivateCertStore `
              /n "AodFreeze Test Certificate" `
              "$file"

            if ($LASTEXITCODE -ne 0) {
              throw "Podpisywanie nie powiodło się: $file"
            }
          }

      # ============================================================
      # 7. VERIFY EMBEDDED SIGNATURES
      # ============================================================

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sysFiles = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $sysFiles) {

            Write-Host ""
            Write-Host "=== VERIFY $file ==="

            & $env:SIGNTOOL verify /pa /v "$file"

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Standardowa weryfikacja /pa nie potwierdziła certyfikatu testowego."
              Write-Host "To jest oczekiwane dla własnego certyfikatu testowego."
            }
          }

      # ============================================================
      # 8. REGENERATE CATALOG AFTER SIGNING
      # ============================================================

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item `
            "DistDriver\diskflt.cat" `
            -Force `
            -ErrorAction SilentlyContinue

          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\inf2cat.exe" `
            /driver:"DistDriver" `
            /os:10_X64

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat zakończył się błędem: $LASTEXITCODE"
          }

          if (!(Test-Path "DistDriver\diskflt.cat")) {
            throw "Inf2Cat nie utworzył DistDriver\diskflt.cat"
          }

          Write-Host "Catalog created:"
          Get-Item "DistDriver\diskflt.cat" |
            Select-Object FullName, Length

      # ============================================================
      # 9. SIGN CATALOG
      # ============================================================

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & $env:SIGNTOOL `
            sign `
            /v `
            /fd SHA256 `
            /a `
            /s PrivateCertStore `
            /n "AodFreeze Test Certificate" `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Podpisywanie katalogu nie powiodło się."
          }

      # ============================================================
      # 10. VERIFY CATALOG
      # ============================================================

      - name: Verify catalog signature
        shell: pwsh
        run: |
          Write-Host "=== VERIFY CATALOG ==="

          & $env:SIGNTOOL `
            verify `
            /pa `
            /v `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Standardowa weryfikacja /pa nie potwierdziła własnego certyfikatu testowego."
            Write-Host "Nie traktujemy tego jako błąd budowania."
          }

      # ============================================================
      # 11. PREPARE FINAL PACKAGE
      # ============================================================

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "AodFreeze-package.zip" `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "$package\Driver\amd64"
          New-Item -ItemType Directory -Force -Path "$package\Driver\i386"
          New-Item -ItemType Directory -Force -Path "$package\Tools"

          # Driver
          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          # Tools
          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          if (Test-Path "cabarc.exe") {
            Copy-Item `
              "cabarc.exe" `
              "$package\Tools\cabarc.exe" `
              -Force
          }

          @"
          AodFreeze
          ==========

          Driver:
            Driver\diskflt.inf
            Driver\diskflt.cat
            Driver\amd64\diskflt.sys
            Driver\i386\diskflt.sys

          Tools:
            Tools\DiskfltInst.exe
            Tools\DiskfltBufmon.exe
            Tools\diskfltmgmt.exe
            Tools\cabarc.exe (if present)

          Build:
            Release
            x64
            Windows 11
            WDK 10.0.26100.0

          Signing:
            TEST SIGNED
            AodFreeze Test Certificate

          IMPORTANT:
            This package is intended for Windows test-signing mode.
            It is NOT Microsoft production-signed.
          "@ | Set-Content `
            "$package\README.txt" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "=== FINAL PACKAGE ==="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

      # ============================================================
      # 12. SHOW FILES / HASHES
      # ============================================================

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          Write-Host "=== SYS FILES ==="

          Get-ChildItem `
            "AodFreeze-package" `
            -Recurse `
            -Include *.sys |
            ForEach-Object {

              Write-Host ""
              Write-Host "FILE: $($_.FullName)"

              Get-FileHash `
                $_.FullName `
                -Algorithm SHA256

              & $env:SIGNTOOL `
                verify `
                /pa `
                /v `
                $_.FullName

              if ($LASTEXITCODE -ne 0) {
                Write-Host "Test certificate is not trusted by default Windows policy."
              }
            }

          Write-Host ""
          Write-Host "=== CAT ==="

          Get-FileHash `
            "AodFreeze-package\Driver\diskflt.cat" `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "=== ZIP ==="

          Get-Item "AodFreeze-package.zip" |
            Select-Object FullName, Length

          Get-FileHash `
            "AodFreeze-package.zip" `
            -Algorithm SHA256

      # ============================================================
      # 13. UPLOAD PACKAGE
      # ============================================================

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test
          path: AodFreeze-package.zip
          if-no-files-found: error
          retention-days: 30
