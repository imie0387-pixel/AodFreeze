name: Build AodFreeze

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: aodfreeze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 / WinXP / v141 MFC support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          if (-not (Test-Path $setup)) {
            throw "Visual Studio setup.exe not found: $setup"
          }

          $vsPath = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath |
            Select-Object -First 1).Trim()

          if (-not $vsPath) {
            throw "Visual Studio installation path could not be detected."
          }

          Write-Host "VS path: $vsPath"

          $v141Id = "Microsoft.VisualStudio.Component.VC.v141.x86.x64"
          $mfcId = "Microsoft.VisualStudio.Component.VC.v141.MFC"
          $xpId = "Microsoft.VisualStudio.Component.WinXP"

          Write-Host "=== CURRENT VS COMPONENT STATE ==="

          $v141Installed = [bool](
            & $vswhere -latest -products * `
              -requires $v141Id `
              -property installationPath 2>$null
          )

          $mfcInstalled = [bool](
            & $vswhere -latest -products * `
              -requires $mfcId `
              -property installationPath 2>$null
          )

          $xpInstalled = [bool](
            & $vswhere -latest -products * `
              -requires $xpId `
              -property installationPath 2>$null
          )

          Write-Host "v141 component: $v141Installed"
          Write-Host "v141 MFC component: $mfcInstalled"
          Write-Host "WinXP component: $xpInstalled"

          Write-Host "=== CHECKING EXISTING v141 FILES ==="

          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"

          $v141Dirs = @()

          if (Test-Path $msvcRoot) {
            $v141Dirs = @(
              Get-ChildItem $msvcRoot -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like "14.16*" }
            )
          }

          $v141Cl = $null
          $afxwin = $null

          foreach ($dir in $v141Dirs) {
            $clCandidate = Join-Path $dir.FullName "bin\Hostx64\x64\cl.exe"
            $afxCandidate = Join-Path $dir.FullName "atlmfc\include\afxwin.h"

            if (-not $v141Cl -and (Test-Path $clCandidate)) {
              $v141Cl = Get-Item $clCandidate
            }

            if (-not $afxwin -and (Test-Path $afxCandidate)) {
              $afxwin = Get-Item $afxCandidate
            }
          }

          Write-Host "Existing v141 compiler: $($v141Cl.FullName)"
          Write-Host "Existing afxwin.h: $($afxwin.FullName)"

          if (-not $v141Cl -or -not $afxwin) {

            Write-Host "Required v141 files are missing."
            Write-Host "Installing components directly with Visual Studio setup.exe..."

            $componentIds = @(
              $v141Id
              $mfcId
              $xpId
            )

            foreach ($componentId in $componentIds) {

              Write-Host ""
              Write-Host "=== INSTALLING $componentId ==="

              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $setup
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true

              [void]$psi.ArgumentList.Add("modify")
              [void]$psi.ArgumentList.Add("--installPath")
              [void]$psi.ArgumentList.Add($vsPath)
              [void]$psi.ArgumentList.Add("--channelId")
              [void]$psi.ArgumentList.Add("VisualStudio.17.Release")
              [void]$psi.ArgumentList.Add("--add")
              [void]$psi.ArgumentList.Add($componentId)
              [void]$psi.ArgumentList.Add("--quiet")
              [void]$psi.ArgumentList.Add("--norestart")

              $process = [System.Diagnostics.Process]::Start($psi)

              if (-not $process) {
                throw "Failed to start Visual Studio Installer for $componentId"
              }

              $process.WaitForExit()

              Write-Host "Installer exit code for ${componentId}: $($process.ExitCode)"

              if ($process.ExitCode -notin @(0, 3010, 1641)) {
                throw "Visual Studio component installation failed for ${componentId} with exit code $($process.ExitCode)"
              }
            }
          }

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "=== VERIFYING v141 FILES AFTER INSTALLATION ==="

          if (-not (Test-Path $msvcRoot)) {
            throw "MSVC tools directory not found: $msvcRoot"
          }

          Write-Host "MSVC directories:"

          Get-ChildItem $msvcRoot -Directory |
            Sort-Object Name |
            Select-Object Name, FullName

          $v141Dirs = @(
            Get-ChildItem $msvcRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "14.16*" }
          )

          if (-not $v141Dirs) {
            throw "v141 MSVC 14.16 directory was not found under $msvcRoot"
          }

          $v141Cl = $null
          $afxwin = $null

          foreach ($dir in $v141Dirs) {

            Write-Host "Checking v141 directory: $($dir.FullName)"

            $clCandidate = Join-Path $dir.FullName "bin\Hostx64\x64\cl.exe"
            $afxCandidate = Join-Path $dir.FullName "atlmfc\include\afxwin.h"

            if (Test-Path $clCandidate) {
              $v141Cl = Get-Item $clCandidate
            }

            if (Test-Path $afxCandidate) {
              $afxwin = Get-Item $afxCandidate
            }
          }

          if (-not $v141Cl) {
            throw "v141 cl.exe was not found after installation."
          }

          if (-not $afxwin) {
            Write-Host "=== SEARCHING VISUAL STUDIO FOR AFXWIN.H ==="

            $afxSearchRoot = "${env:ProgramFiles}\Microsoft Visual Studio"

            $afxwin = Get-ChildItem `
              $afxSearchRoot `
              -Filter afxwin.h `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $afxwin) {
            throw "afxwin.h was not found after v141 MFC installation."
          }

          Write-Host ""
          Write-Host "=== v141 VERIFIED ==="
          Write-Host "v141 cl.exe: $($v141Cl.FullName)"
          Write-Host "afxwin.h: $($afxwin.FullName)"

          if (-not (Test-Path $afxwin.FullName)) {
            throw "afxwin.h verification failed."
          }

          Write-Host "v141 + MFC verification successful."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Runner diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== RUNNER ==="

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host "=== MSBUILD ==="

          msbuild -version

          Write-Host "=== WDK ==="

          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"

          Get-ChildItem "$kitsRoot\bin" -Directory |
            Sort-Object Name |
            Select-Object Name, FullName

      - name: Build driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $PWD "DiskFilter\DiskFilter.vcxproj"

          if (-not (Test-Path $project)) {
            throw "Driver project not found: $project"
          }

          & msbuild $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed with exit code $LASTEXITCODE"
          }

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $PWD "DistDriver"

          New-Item -ItemType Directory -Force -Path `
            $dist, `
            "$dist\amd64", `
            "$dist\i386" |
            Out-Null

          $sys = Join-Path $PWD "DiskFilter\x64\Release\diskflt.sys"
          $inf = Join-Path $PWD "DiskFilter\x64\Release\DiskFilter\diskflt.inf"
          $cat = Join-Path $PWD "DiskFilter\x64\Release\DiskFilter\diskflt.cat"

          if (-not (Test-Path $sys)) {
            throw "Built SYS not found: $sys"
          }

          if (-not (Test-Path $inf)) {
            throw "Built INF not found: $inf"
          }

          if (-not (Test-Path $cat)) {
            throw "Built CAT not found: $cat"
          }

          Copy-Item $sys $dist -Force
          Copy-Item $inf $dist -Force
          Copy-Item $cat $dist -Force

          # Required by legacy resource projects during solution build.
          # These are build-time copies only.
          # The final package uses root diskflt.sys.
          Copy-Item $sys "$dist\amd64\diskflt.sys" -Force
          Copy-Item $sys "$dist\i386\diskflt.sys" -Force

          Write-Host "=== DISTDRIVER CONTENT ==="

          Get-ChildItem $dist -Recurse -File |
            Select-Object FullName, Length

      - name: Build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $solution = Join-Path $PWD "DiskFilter.sln"

          if (-not (Test-Path $solution)) {
            throw "Solution not found: $solution"
          }

          & msbuild $solution `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true

          if ($LASTEXITCODE -ne 0) {
            throw "Solution build failed with exit code $LASTEXITCODE"
          }

      - name: Locate SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $preferred = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"

          if (Test-Path $preferred) {
            $signtool = $preferred
          }
          else {
            $signtool = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\x64\\signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          Write-Host "SignTool: $signtool"

          "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Create test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cert = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object {
              $_.Subject -eq "CN=AodFreeze Test Certificate" -and
              $_.HasPrivateKey
            } |
            Select-Object -First 1

          if (-not $cert) {

            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=AodFreeze Test Certificate" `
              -CertStoreLocation "Cert:\LocalMachine\My" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(13)
          }

          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

          Export-Certificate `
            -Cert $cert `
            -FilePath (Join-Path $PWD "AodFreeze-Test.cer") `
            -Force |
            Out-Null

          Write-Host "Certificate: $($cert.Subject)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"
          Write-Host "Expires: $($cert.NotAfter)"

      - name: Trust test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $certFile = Join-Path $PWD "AodFreeze-Test.cer"

          Import-Certificate `
            -FilePath $certFile `
            -CertStoreLocation "Cert:\LocalMachine\Root" |
            Out-Null

          Import-Certificate `
            -FilePath $certFile `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" |
            Out-Null

      - name: Sign driver SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = Join-Path $PWD "DistDriver\diskflt.sys"

          if (-not (Test-Path $path)) {
            throw "SYS not found: $path"
          }

          & $env:SIGNTOOL_PATH `
            sign `
            /v `
            /fd sha256 `
            /sm `
            /s My `
            /sha1 $env:CERT_THUMBPRINT `
            $path

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed to sign $path with exit code $LASTEXITCODE"
          }

      - name: Verify embedded SYS test signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = Join-Path $PWD "DistDriver\diskflt.sys"

          # /pa is correct for a test-signed embedded driver signature.
          # Do not use /kp here.
          & $env:SIGNTOOL_PATH verify /v /pa $path

          if ($LASTEXITCODE -ne 0) {
            throw "Embedded test signature verification failed for ${path}"
          }

          $sig = Get-AuthenticodeSignature $path

          Write-Host "Signature status: $($sig.Status)"

          if ($sig.Status -ne "Valid") {
            throw "PowerShell signature verification failed for ${path}: $($sig.Status)"
          }

      - name: Regenerate catalog after SYS signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $inf2cat = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x86\Inf2Cat.exe"

          if (-not (Test-Path $inf2cat)) {
            $inf2cat = Get-ChildItem `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter Inf2Cat.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $inf2cat) {
            throw "Inf2Cat.exe not found."
          }

          $dist = Join-Path $PWD "DistDriver"

          # Known-good OS target for this WDK/project.
          & $inf2cat `
            /driver:"$dist" `
            /os:10_x64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE"
          }

          $cat = Join-Path $dist "diskflt.cat"

          if (-not (Test-Path $cat)) {
            throw "Inf2Cat did not create: $cat"
          }

          $drvcat = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.26100.0\x86\drvcat.exe"

          if (Test-Path $drvcat) {

            & $drvcat `
              $cat `
              /set WdkVersion 10.0.26100.0 `
              /set WdkAssemblyVersion 10.0.26100.4202

            if ($LASTEXITCODE -ne 0) {
              throw "drvcat failed with exit code $LASTEXITCODE"
            }
          }

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $path = Join-Path $PWD "DistDriver\diskflt.cat"

          if (-not (Test-Path $path)) {
            throw "CAT not found: $path"
          }

          & $env:SIGNTOOL_PATH `
            sign `
            /v `
            /fd sha256 `
            /sm `
            /s My `
            /sha1 $env:CERT_THUMBPRINT `
            $path

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed to sign $path with exit code $LASTEXITCODE"
          }

      - name: Verify signed driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $PWD "DistDriver"

          $inf = Join-Path $dist "diskflt.inf"
          $cat = Join-Path $dist "diskflt.cat"
          $sys = Join-Path $dist "diskflt.sys"

          & $env:SIGNTOOL_PATH verify /v /pa $cat

          if ($LASTEXITCODE -ne 0) {
            throw "CAT signature verification failed for ${cat}"
          }

          & $env:SIGNTOOL_PATH verify /v /pa /c $cat $inf

          if ($LASTEXITCODE -ne 0) {
            throw "INF catalog verification failed for ${inf}"
          }

          & $env:SIGNTOOL_PATH verify /v /pa /c $cat $sys

          if ($LASTEXITCODE -ne 0) {
            throw "SYS catalog verification failed for ${sys}"
          }

          & $env:SIGNTOOL_PATH verify /v /pa $sys

          if ($LASTEXITCODE -ne 0) {
            throw "Embedded SYS signature verification failed for ${sys}"
          }

      - name: Prepare final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path $PWD "AodFreeze-package"
          $driverDir = Join-Path $package "Driver"
          $toolsDir = Join-Path $package "Tools"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $driverDir, $toolsDir |
            Out-Null

          # Final package layout matches the build-generated INF:
          # diskflt.sys is at Driver root.
          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$driverDir\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$driverDir\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.sys" `
            "$driverDir\diskflt.sys" `
            -Force

          $toolCandidates = @(
            "x64\Release\DiskfltInst.exe",
            "x64\Release\diskfltmgmt.exe",
            "x64\Release\DiskfltBufmon.exe",
            "DiskfltInst\x64\Release\DiskfltInst.exe",
            "diskfltmgmt\x64\Release\diskfltmgmt.exe",
            "DiskfltBufmon\x64\Release\DiskfltBufmon.exe"
          )

          foreach ($candidate in $toolCandidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate $toolsDir -Force
            }
          }

          Copy-Item `
            "AodFreeze-Test.cer" `
            $package `
            -Force

          @"
          AodFreeze test-signed driver package

          Target:
            Windows 11 x64
            Windows 11 25H2

          IMPORTANT:
            This package uses a test certificate.

          Before installing on a test machine:
            1. Disable Secure Boot.
            2. Open an elevated Command Prompt.
            3. Run: bcdedit /set testsigning on
            4. Reboot Windows.
            5. Install the driver.

          Public test certificate:
            AodFreeze-Test.cer

          The private signing key is NOT included in this package.
          "@ |
            Set-Content "$package\README.txt" -Encoding UTF8

          Write-Host "=== FINAL PACKAGE ==="

          Get-ChildItem $package -Recurse -File |
            Select-Object FullName, Length

      - name: Final integrity check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path $PWD "AodFreeze-package"

          $required = @(
            "$package\Driver\diskflt.inf",
            "$package\Driver\diskflt.cat",
            "$package\Driver\diskflt.sys",
            "$package\AodFreeze-Test.cer",
            "$package\README.txt"
          )

          foreach ($file in $required) {

            if (-not (Test-Path $file)) {
              throw "Required package file missing: $file"
            }

            Write-Host "OK: $file"
          }

          Get-FileHash `
            "$package\Driver\diskflt.sys" `
            -Algorithm SHA256

          Get-FileHash `
            "$package\Driver\diskflt.cat" `
            -Algorithm SHA256

          Get-FileHash `
            "$package\Driver\diskflt.inf" `
            -Algorithm SHA256

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Join-Path $PWD "AodFreeze-package"
          $zip = Join-Path $PWD "AodFreeze-package.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Get-FileHash $zip -Algorithm SHA256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-package
          path: |
            AodFreeze-package.zip
            AodFreeze-package
          if-no-files-found: error
          retention-days: 14
