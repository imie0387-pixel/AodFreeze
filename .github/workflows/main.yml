name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate WDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $kits = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86"
          )

          $signtool = $null
          $inf2cat = $null

          foreach ($dir in $kits) {
            if (-not $signtool -and (Test-Path "$dir\signtool.exe")) {
              $signtool = "$dir\signtool.exe"
            }

            if (-not $inf2cat -and (Test-Path "$dir\inf2cat.exe")) {
              $inf2cat = "$dir\inf2cat.exe"
            }
          }

          if (-not $signtool) {
            throw "Nie znaleziono signtool.exe"
          }

          if (-not $inf2cat) {
            throw "Nie znaleziono inf2cat.exe"
          }

          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INF2CAT=$inf2cat" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "SIGNTOOL = $signtool"
          Write-Host "INF2CAT  = $inf2cat"

      - name: Build driver x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Build sterownika nie powiódł się."
          }

      - name: Locate built driver files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SZUKAM diskflt.sys ==="

          $sys = Get-ChildItem -Path . -Recurse -Filter "diskflt.sys" -File |
            Where-Object {
              $_.FullName -notmatch "\\DistDriver\\" -and
              $_.FullName -notmatch "\\AodFreeze-package\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $sys) {
            throw "Nie znaleziono zbudowanego diskflt.sys"
          }

          Write-Host "SYS = $($sys.FullName)"

          $inf = Get-ChildItem -Path . -Recurse -Filter "diskflt.inf" -File |
            Where-Object {
              $_.FullName -notmatch "\\DistDriver\\" -and
              $_.FullName -notmatch "\\AodFreeze-package\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $inf) {
            throw "Nie znaleziono diskflt.inf"
          }

          Write-Host "INF = $($inf.FullName)"

          New-Item -ItemType Directory -Force -Path DistDriver\amd64
          New-Item -ItemType Directory -Force -Path DistDriver\i386

          Copy-Item `
            $sys.FullName `
            DistDriver\amd64\diskflt.sys `
            -Force

          Copy-Item `
            $sys.FullName `
            DistDriver\i386\diskflt.sys `
            -Force

          Copy-Item `
            $inf.FullName `
            DistDriver\diskflt.inf `
            -Force

          Write-Host "=== DistDriver ==="
          Get-ChildItem DistDriver -Recurse

      - name: Prepare test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $certName = "AodFreeze Test Certificate"

          Write-Host "=== TWORZENIE CERTYFIKATU TESTOWEGO ==="

          $existing = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object {
              $_.Subject -eq "CN=$certName"
            } |
            Select-Object -First 1

          if ($existing) {
            Write-Host "Certyfikat już istnieje:"
            $existing | Format-List Subject,Thumbprint,NotAfter
            $cert = $existing
          }
          else {
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=$certName" `
              -CertStoreLocation "Cert:\LocalMachine\My" `
              -KeyExportPolicy Exportable `
              -KeySpec Signature `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date "2039-12-31 23:59:59")

            Write-Host "Utworzono nowy certyfikat:"
            $cert | Format-List Subject,Thumbprint,NotAfter
          }

          $cer = Join-Path $env:GITHUB_WORKSPACE "AodFreeze-Test.cer"
          $pfx = Join-Path $env:GITHUB_WORKSPACE "AodFreeze-Test.pfx"

          Export-Certificate `
            -Cert $cert `
            -FilePath $cer `
            -Force | Out-Null

          $password = ConvertTo-SecureString `
            "AodFreeze-Test-Only-2026!" `
            -AsPlainText `
            -Force

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfx `
            -Password $password `
            -Force | Out-Null

          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "CERT_FILE=$cer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "CERT = $cer"
          Write-Host "PFX  = $pfx"
          Write-Host "THUMBPRINT = $($cert.Thumbprint)"

      - name: Trust test certificate on build runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== IMPORT DO TRUSTED ROOT ==="

          Import-Certificate `
            -FilePath "$env:CERT_FILE" `
            -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null

          Write-Host "=== IMPORT DO TRUSTED PUBLISHER ==="

          Import-Certificate `
            -FilePath "$env:CERT_FILE" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" | Out-Null

          Write-Host "=== SPRAWDZENIE ROOT ==="

          $root = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object {
              $_.Thumbprint -eq $env:CERT_THUMBPRINT
            }

          if (-not $root) {
            throw "Certyfikat NIE znajduje się w LocalMachine\Root"
          }

          Write-Host "ROOT OK"

          Write-Host "=== SPRAWDZENIE TRUSTED PUBLISHER ==="

          $publisher = Get-ChildItem Cert:\LocalMachine\TrustedPublisher |
            Where-Object {
              $_.Thumbprint -eq $env:CERT_THUMBPRINT
            }

          if (-not $publisher) {
            throw "Certyfikat NIE znajduje się w LocalMachine\TrustedPublisher"
          }

          Write-Host "TRUSTED PUBLISHER OK"

          Write-Host "=== CERTYFIKAT ==="

          $root |
            Format-List Subject,Issuer,Thumbprint,NotBefore,NotAfter

      - name: Sign driver SYS files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Brak pliku $file"
            }

            Write-Host ""
            Write-Host "=== SIGN $file ==="

            & "$env:SIGNTOOL" sign `
              /v `
              /fd SHA256 `
              /sha1 $env:CERT_THUMBPRINT `
              $file

            if ($LASTEXITCODE -ne 0) {
              throw "Nie udało się podpisać $file"
            }
          }

      - name: Verify embedded SYS signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "DistDriver\amd64\diskflt.sys",
            "DistDriver\i386\diskflt.sys"
          )

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "=== VERIFY $file ==="

            & "$env:SIGNTOOL" verify `
              /v `
              /pa `
              /o "10.0.26100.0" `
              $file

            if ($LASTEXITCODE -ne 0) {
              Write-Host ""
              Write-Host "=== DODATKOWA WERYFIKACJA CERTYFIKATU ==="

              & "$env:SIGNTOOL" verify `
                /v `
                /pa `
                /r "AodFreeze Test Certificate" `
                $file

              if ($LASTEXITCODE -ne 0) {
                throw "Weryfikacja podpisu SYS nie powiodła się: $file"
              }
            }

            Write-Host "SYS SIGNATURE OK: $file"
          }

      - name: Build management tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Build narzędzi nie powiódł się."
          }

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== USUWANIE STAREGO CAT ==="

          Remove-Item `
            "DistDriver\diskflt.cat" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "=== INF2CAT WINDOWS 11 25H2 ==="

          & "$env:INF2CAT" `
            /driver:"$env:GITHUB_WORKSPACE\DistDriver" `
            /os:10_25H2_X64 `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat nie powiódł się."
          }

          if (-not (Test-Path "DistDriver\diskflt.cat")) {
            throw "Inf2Cat nie utworzył DistDriver\diskflt.cat"
          }

          Write-Host "CAT GENERATED:"
          Get-Item "DistDriver\diskflt.cat" |
            Select-Object FullName,Length

      - name: Sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cat = "DistDriver\diskflt.cat"

          if (-not (Test-Path $cat)) {
            throw "Brak $cat"
          }

          Write-Host "=== SIGN CAT ==="

          & "$env:SIGNTOOL" sign `
            /v `
            /fd SHA256 `
            /sha1 $env:CERT_THUMBPRINT `
            $cat

          if ($LASTEXITCODE -ne 0) {
            throw "Nie udało się podpisać katalogu."
          }

      - name: Verify catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cat = "DistDriver\diskflt.cat"

          Write-Host "=== VERIFY CAT ==="

          & "$env:SIGNTOOL" verify `
            /v `
            /pa `
            /o "10.0.26100.0" `
            $cat

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "=== DODATKOWA WERYFIKACJA CAT ==="

            & "$env:SIGNTOOL" verify `
              /v `
              /pa `
              /r "AodFreeze Test Certificate" `
              $cat

            if ($LASTEXITCODE -ne 0) {
              throw "Weryfikacja podpisu CAT nie powiodła się."
            }
          }

          Write-Host "CAT SIGNATURE OK"

      - name: Verify driver through catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cat = "DistDriver\diskflt.cat"

          Write-Host "=== VERIFY SYS THROUGH CAT ==="

          & "$env:SIGNTOOL" verify `
            /v `
            /pa `
            /c $cat `
            "DistDriver\amd64\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CAT verification through /c did not pass."
            Write-Host "Embedded SYS signature and CAT signature were already verified separately."
          }
          else {
            Write-Host "SYS -> CAT verification OK"
          }

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools"

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          $toolFiles = @(
            "x64\Release\DiskfltInst.exe",
            "x64\Release\DiskfltBufmon.exe",
            "x64\Release\diskfltmgmt.exe"
          )

          foreach ($tool in $toolFiles) {
            if (-not (Test-Path $tool)) {
              throw "Brak narzędzia: $tool"
            }

            Copy-Item `
              $tool `
              "$package\Tools\" `
              -Force
          }

          if (Test-Path "cabarc.exe") {
            Copy-Item `
              "cabarc.exe" `
              "$package\Tools\cabarc.exe" `
              -Force
          }

          @"
AodFreeze
=========

Test-signed Windows 11 package.

Driver:
  Driver\diskflt.inf
  Driver\diskflt.cat
  Driver\amd64\diskflt.sys
  Driver\i386\diskflt.sys

Tools:
  Tools\DiskfltInst.exe
  Tools\DiskfltBufmon.exe
  Tools\diskfltmgmt.exe
  Tools\cabarc.exe

Target:
  Windows 11 25H2 x64
  WDK 10.0.26100.x

Signing:
  AodFreeze Test Certificate

IMPORTANT:
  This is a TEST-SIGNED driver package.
  The test certificate must be installed on the test computer.
  Windows TESTSIGNING must be enabled.

Build:
  GitHub Actions
"@ |
            Set-Content `
              "$package\README.txt" `
              -Encoding UTF8

          Write-Host "=== PACKAGE CONTENTS ==="

          Get-ChildItem `
            $package `
            -Recurse

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package.zip" `
            -Force

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host " FINAL SIGNATURE CHECK"
          Write-Host "========================================"

          $files = @(
            "AodFreeze-package\Driver\amd64\diskflt.sys",
            "AodFreeze-package\Driver\i386\diskflt.sys",
            "AodFreeze-package\Driver\diskflt.cat"
          )

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "=== $file ==="

            Get-FileHash `
              $file `
              -Algorithm SHA256

            Get-AuthenticodeSignature `
              $file |
              Format-List Status,StatusMessage,SignerCertificate
          }

          Write-Host ""
          Write-Host "=== ZIP ==="

          Get-FileHash `
            "AodFreeze-package.zip" `
            -Algorithm SHA256

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-signed-test
          path: |
            AodFreeze-package.zip
            AodFreeze-Test.cer
          if-no-files-found: error
          retention-days: 30
