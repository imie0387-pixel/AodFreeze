name: Build AodFreeze

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v141 XP
        uses: thepwrtank18/install-vs-components@v1.0.0
        with:
          components: Microsoft.VisualStudio.Component.WinXP

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver x64
        shell: pwsh
        run: |
          msbuild DiskFilter\DiskFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Driver build failed"
          }

      - name: Prepare DistDriver
        shell: pwsh
        run: |
          Remove-Item `
            "DistDriver" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\amd64" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "DistDriver\i386" | Out-Null

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\diskflt.sys" `
            "DistDriver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "DiskFilter\x64\Release\DiskFilter\diskflt.inf" `
            "DistDriver\diskflt.inf" `
            -Force

          Write-Host "=== DISTDRIVER ==="
          Get-ChildItem `
            "DistDriver" `
            -Recurse

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $binRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $signtool = Get-ChildItem `
            -Path $binRoot `
            -Recurse `
            -Filter "signtool.exe" `
            -File |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          $inf2cat = Get-ChildItem `
            -Path $binRoot `
            -Recurse `
            -Filter "inf2cat.exe" `
            -File |
            Where-Object {
              $_.FullName -match "\\x86\\inf2cat\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          if (-not $inf2cat) {
            throw "inf2cat.exe not found"
          }

          Write-Host "SignTool:"
          Write-Host $signtool.FullName

          Write-Host "Inf2Cat:"
          Write-Host $inf2cat.FullName

          "SIGNTOOL=$($signtool.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "INF2CAT=$($inf2cat.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Prepare test signing certificate
        shell: pwsh
        run: |
          $certDir = "Signing"

          Remove-Item `
            $certDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $certDir | Out-Null

          $passwordText = "AodFreeze-Test-2026!"

          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AodFreeze Test Signing" `
            -FriendlyName "AodFreeze Test Signing" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -NotAfter (Get-Date).AddYears(5)

          if (-not $cert) {
            throw "Failed to create test signing certificate"
          }

          Write-Host "Certificate created:"
          Write-Host "Subject: $($cert.Subject)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"
          Write-Host "NotAfter: $($cert.NotAfter)"

          Export-Certificate `
            -Cert $cert `
            -FilePath "$certDir\AodFreeze-Test.cer" `
            -Type CERT | Out-Null

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$certDir\AodFreeze-Test.pfx" `
            -Password $password | Out-Null

          if (-not (Test-Path "$certDir\AodFreeze-Test.cer")) {
            throw "CER export failed"
          }

          if (-not (Test-Path "$certDir\AodFreeze-Test.pfx")) {
            throw "PFX export failed"
          }

          "SIGN_CERT=$certDir\AodFreeze-Test.pfx" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SIGN_PASSWORD=$passwordText" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Sign driver SYS
        shell: pwsh
        run: |
          Write-Host "=== SIGN AMD64 SYS ==="

          & "$env:SIGNTOOL" sign `
            /v `
            /fd SHA256 `
            /f "$env:SIGN_CERT" `
            /p "$env:SIGN_PASSWORD" `
            "DistDriver\amd64\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            throw "Signing amd64 diskflt.sys failed"
          }

          Write-Host "=== SIGN I386 SYS ==="

          & "$env:SIGNTOOL" sign `
            /v `
            /fd SHA256 `
            /f "$env:SIGN_CERT" `
            /p "$env:SIGN_PASSWORD" `
            "DistDriver\i386\diskflt.sys"

          if ($LASTEXITCODE -ne 0) {
            throw "Signing i386 diskflt.sys failed"
          }

          Write-Host "Driver signing completed."

      - name: Verify SYS signatures
        shell: pwsh
        run: |
          Write-Host "=== AMD64 SYS SIGNATURE ==="

          Get-AuthenticodeSignature `
            "DistDriver\amd64\diskflt.sys" |
            Format-List Status,StatusMessage,SignerCertificate

          Write-Host "=== I386 SYS SIGNATURE ==="

          Get-AuthenticodeSignature `
            "DistDriver\i386\diskflt.sys" |
            Format-List Status,StatusMessage,SignerCertificate

          Write-Host "=== SIGCHECK AMD64 ==="

          & "$env:SIGNTOOL" verify `
            /pa `
            /v `
            "DistDriver\amd64\diskflt.sys"

          Write-Host "Signtool verify exit code: $LASTEXITCODE"

      - name: Build management tools
        shell: pwsh
        run: |
          msbuild DiskFilter.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:EnableInfVerif=false `
            /p:InfVerifEnabled=false `
            /p:SkipPackageVerification=true `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "Management tools build failed"
          }

      - name: Generate catalog for Windows 11 25H2
        shell: pwsh
        run: |
          Remove-Item `
            "DistDriver\diskflt.cat" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "=== INF2CAT ==="

          & "$env:INF2CAT" `
            /driver:"$PWD\DistDriver" `
            /os:10_25H2_X64 `
            /uselocaltime `
            /verbose

          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed"
          }

          if (-not (Test-Path "DistDriver\diskflt.cat")) {
            throw "Inf2Cat did not create diskflt.cat"
          }

          Write-Host "Catalog created."

          Get-Item `
            "DistDriver\diskflt.cat" |
            Select-Object FullName,Length

      - name: Sign catalog
        shell: pwsh
        run: |
          Write-Host "=== SIGN CAT ==="

          & "$env:SIGNTOOL" sign `
            /v `
            /fd SHA256 `
            /f "$env:SIGN_CERT" `
            /p "$env:SIGN_PASSWORD" `
            "DistDriver\diskflt.cat"

          if ($LASTEXITCODE -ne 0) {
            throw "Signing diskflt.cat failed"
          }

          Write-Host "Catalog signing completed."

      - name: Verify catalog signature
        shell: pwsh
        run: |
          Write-Host "=== CAT SIGNATURE ==="

          Get-AuthenticodeSignature `
            "DistDriver\diskflt.cat" |
            Format-List Status,StatusMessage,SignerCertificate

          Write-Host "=== SIGTOOL CAT ==="

          & "$env:SIGNTOOL" verify `
            /pa `
            /v `
            "DistDriver\diskflt.cat"

          Write-Host "Signtool verify exit code: $LASTEXITCODE"

      - name: Prepare AodFreeze package
        shell: pwsh
        run: |
          $package = "AodFreeze-package"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\amd64" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Driver\i386" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$package\Tools" | Out-Null

          Copy-Item `
            "DistDriver\diskflt.inf" `
            "$package\Driver\diskflt.inf" `
            -Force

          Copy-Item `
            "DistDriver\diskflt.cat" `
            "$package\Driver\diskflt.cat" `
            -Force

          Copy-Item `
            "DistDriver\amd64\diskflt.sys" `
            "$package\Driver\amd64\diskflt.sys" `
            -Force

          Copy-Item `
            "DistDriver\i386\diskflt.sys" `
            "$package\Driver\i386\diskflt.sys" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltInst.exe" `
            "$package\Tools\DiskfltInst.exe" `
            -Force

          Copy-Item `
            "x64\Release\DiskfltBufmon.exe" `
            "$package\Tools\DiskfltBufmon.exe" `
            -Force

          Copy-Item `
            "x64\Release\diskfltmgmt.exe" `
            "$package\Tools\diskfltmgmt.exe" `
            -Force

          Copy-Item `
            "cabarc.exe" `
            "$package\Tools\cabarc.exe" `
            -Force

          Copy-Item `
            "Signing\AodFreeze-Test.cer" `
            "$package\AodFreeze-Test.cer" `
            -Force

          $readme = @(
            "AodFreeze"
            "========="
            ""
            "Driver:"
            "  Driver\diskflt.inf"
            "  Driver\diskflt.cat"
            "  Driver\amd64\diskflt.sys"
            "  Driver\i386\diskflt.sys"
            ""
            "Tools:"
            "  Tools\DiskfltInst.exe"
            "  Tools\DiskfltBufmon.exe"
            "  Tools\diskfltmgmt.exe"
            "  Tools\cabarc.exe"
            ""
            "Test certificate:"
            "  AodFreeze-Test.cer"
            ""
            "Build:"
            "  Release"
            "  x64"
            "  Windows 11 25H2"
            "  WDK 10.0.26100.0"
            ""
            "IMPORTANT:"
            "This package uses a TEST certificate."
            "Windows must remain in TESTSIGNING mode."
            ""
            "Install AodFreeze-Test.cer into:"
            "  Trusted Root Certification Authorities"
            "  Trusted Publishers"
            ""
            "This is a development/test package."
            "It is NOT a Microsoft production-signed driver."
          )

          $readme | Set-Content `
            "$package\README.txt" `
            -Encoding UTF8

          Write-Host "=== PACKAGE CONTENTS ==="

          Get-ChildItem `
            $package `
            -Recurse

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "AodFreeze-package-signed-test.zip" `
            -Force

          Write-Host "=== ZIP ==="

          Get-Item `
            "AodFreeze-package-signed-test.zip" |
            Select-Object FullName,Length

      - name: Show signatures and hashes
        shell: pwsh
        run: |
          Write-Host "=== AMD64 SYS ==="

          Get-AuthenticodeSignature `
            "AodFreeze-package\Driver\amd64\diskflt.sys" |
            Format-List Status,StatusMessage,SignerCertificate

          Get-FileHash `
            "AodFreeze-package\Driver\amd64\diskflt.sys" `
            -Algorithm SHA256

          Write-Host "=== I386 SYS ==="

          Get-AuthenticodeSignature `
            "AodFreeze-package\Driver\i386\diskflt.sys" |
            Format-List Status,StatusMessage,SignerCertificate

          Get-FileHash `
            "AodFreeze-package\Driver\i386\diskflt.sys" `
            -Algorithm SHA256

          Write-Host "=== CAT ==="

          Get-AuthenticodeSignature `
            "AodFreeze-package\Driver\diskflt.cat" |
            Format-List Status,StatusMessage,SignerCertificate

          Get-FileHash `
            "AodFreeze-package\Driver\diskflt.cat" `
            -Algorithm SHA256

          Write-Host "=== ZIP ==="

          Get-FileHash `
            "AodFreeze-package-signed-test.zip" `
            -Algorithm SHA256

      - name: Upload AodFreeze signed test package
        uses: actions/upload-artifact@v4
        with:
          name: AodFreeze-package-signed-test
          path: AodFreeze-package-signed-test.zip
          if-no-files-found: error
          retention-days: 30
